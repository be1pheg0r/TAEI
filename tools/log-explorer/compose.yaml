services:
  log-explorer:
    build: .
    image: taei-log-explorer:local
    container_name: taei-log-explorer
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    ports:
      - "127.0.0.1:8091:8091"
    networks:
      edge:
        aliases:
          - taei-log-explorer
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  edge:
    external: true
    name: outline-stack_edge
