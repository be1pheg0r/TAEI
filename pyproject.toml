[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taei"
version = "0.1.0"
description = "Python project scaffold for TAEI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clearml>=2.1.12",
    "filelock>=3.12",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.34.0",
    "jsonschema>=4.25.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.optional-dependencies]
inference = [
    # PyTorch 2.14+ needs C++20; this upstream commit fixes flash-attn's CUDA build flags.
    "torch==2.14.1",
    "flash-attn @ git+https://github.com/Dao-AILab/flash-attention.git@f87af617fab71c29c11e7f9bc74746ae7534a59d",
    "nano-vllm @ git+https://github.com/GeeeekExplorer/nano-vllm.git@bb823b3e06983d71485a8e1f23715ebd87d98ef8",
    "nvidia-ml-py>=12",
]

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "xxhash>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taei = ["conf/**/*.yaml", "conf/*.yaml"]
[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.14.1"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
