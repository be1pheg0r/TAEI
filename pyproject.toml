[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taei"
version = "0.1.0"
description = "Python project scaffold for TAEI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clearml>=2.1.12",
    "filelock>=3.12",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.34.0",
    "jsonschema>=4.25.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.optional-dependencies]
inference = [
    "torch==2.14.1",
    # Astral's post1 wheel targets Torch 2.14; 2.8.3 wheels only target <=2.11.
    "flash-attn==2.8.3.post1+cu.13.0.torch.2.14",
    "nano-vllm @ git+https://github.com/GeeeekExplorer/nano-vllm.git@bb823b3e06983d71485a8e1f23715ebd87d98ef8",
    "nvidia-ml-py>=12",
]

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "xxhash>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taei = ["conf/**/*.yaml", "conf/*.yaml"]

[tool.uv.sources]
flash-attn = { index = "astral-cu130" }

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
