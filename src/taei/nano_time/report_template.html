    --m1: #9085e9; --m2: #008300; --m3: #d55181; --m4: #e66767;
    --c1: #6b9cf0; --c2: #f0a060; --c3: #45c495; --c4: #b18cf0; --c5: #f07890;

    --good: #5cbf7a; --bad: #f08a80; color-scheme: dark;

}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1d; --fg: #ecebe6; --muted: #a9a79e; --line: #3a3935;
  --grid: #2b2a27; --accent: #7fb0ec;
  --part-train: #3987e5; --part-test: #d95926; --part-transfer: #199e70;

}

.neg { color: var(--bad); } .pos { color: var(--good); }

.banner { max-width: none; padding: 10px 14px; border: 1px solid var(--bad); border-radius: 6px; background: var(--surface); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.0/plotly.min.js"></script>
<script>
"use strict";
const DOC = JSON.parse(document.getElementById("report-data").textContent);
let D = {};
const app = document.getElementById("app");
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const PART_LABEL = { train: "train", test: "test", transfer: "перенос" };
const pct = (v, digits = 1) => (v == null ? "—" : (v * 100).toFixed(digits) + "%");
const signed = (v) => (v == null ? "—" : (v > 0 ? "+" : "") + pct(v) + (v > 0 ? " перебор" : v < 0 ? " недобор" : ""));
const num = (v, digits = 4) => (v == null ? "—" : Number.isInteger(v) ? String(v) : Math.abs(v) >= 1e4 || (Math.abs(v) < 1e-3 && v !== 0) ? v.toExponential(3) : (+v).toPrecision(digits));
const int = (v) => (v == null ? "—" : Math.round(v).toLocaleString("ru-RU"));
// TeX for numbers and coefficient names: 1.19e-4 -> 1.19 \\times 10^{-4}, d0 -> d_{0}.
const texNum = (v) => {
  if (v == null) return "\\text{—}";
  if (Number.isInteger(v) || v === 0) return String(v);
  if (Math.abs(v) >= 1e4 || Math.abs(v) < 1e-3) {
    const [mant, exp] = v.toExponential(2).split("e");
    return `${mant} \\times 10^{${+exp}}`;
  }
  return String(+v.toPrecision(4));
};
const texName = (k) => {
  const digits = k.match(/^([A-Za-z]+)(\d+)$/);
  if (digits) return `${digits[1]}_{${digits[2]}}`;
  const [head, ...rest] = k.split("_");
  return rest.length ? `${head}_{\\mathrm{${rest.join("\\,")}}}` : head;
};
const TEX_VAR = { "L": "L", "R": "R", "R_кэш": "R_{\\text{кэш}}", "R_нарезка": "R_{\\text{нарезка}}", "B": "B", "Σℓ": "\\sum\\ell", "O": "O" };
const texVar = (name) => (TEX_VAR[name] ? `\\(${TEX_VAR[name]}\\)` : name);
const subLabel = (text) => String(text).replace(/([A-Za-zΣℓ̂]+)_([A-Za-zА-Яа-яё]+)/g, "$1<sub>$2</sub>");
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "html") node.innerHTML = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
};
const sourceLabel = (id) => (D.sources || []).find((s) => s.id === id)?.label ?? id;
const partColor = (part) => css("--part-" + part) || css("--muted");
const schedColor = (s) => css(String(s).startsWith("fixed") ? "--m2" : "--m1");
const cacheColor = (c) => css(c === "on" ? "--m3" : "--m1");
const schedSymbol = (s) => (String(s).startsWith("fixed") ? "diamond" : "circle");
const coefText = (c) => {
  const parts = Object.entries(c || {}).map(([k, v]) => `${texName(k)} = ${typeof v === "number" ? texNum(v) : `\\text{${v}}`}`);
  return parts.length ? `\\(${parts.join(",\\ ")}\\)` : "—";
};

let sectionNo = 0;
function section(title, lede) {
  sectionNo += 1;
  const s = el("section", {}, el("h2", {}, el("span", { class: "num" }, String(sectionNo).padStart(2, "0")), title));
  if (lede) s.append(el("p", { class: "lede" }, lede));
  app.append(s);
  return s;
}
function table(parent, rows, columns, scroll = false) {
  const head = el("tr", {}, ...columns.map((c) => el("th", { class: c.text ? "text" : "" }, c.label)));
  const body = rows.map((r) => el("tr", {}, ...columns.map((c) => {
    const v = c.value ? c.value(r) : r[c.key];
    const cell = el("td", { class: [c.text ? "text" : "", c.mono ? "mono" : ""].join(" ") });
    if (v instanceof Node) cell.append(v); else cell.textContent = c.fmt ? c.fmt(v, r) : (v ?? "—");
    return cell;
  })));
  parent.append(el("div", { class: "table-wrap" + (scroll ? " scroll" : "") }, el("table", {}, el("thead", {}, head), el("tbody", {}, ...body))));
}
let charts = [];
function chart(parent, build, tall = false) {
  const box = el("div", { class: "chart" + (tall ? " tall" : "") });
  parent.append(box);
  charts.push({ box, build });
  return box;
}
function chartRow(parent) { const row = el("div", { class: "charts" }); parent.append(row); return row; }
function baseLayout(title, xTitle, yTitle, extra = {}) {
  const fg = css("--fg"), muted = css("--muted"), grid = css("--grid");
  const axis = (t) => ({ title: { text: t, font: { size: 12, color: muted } }, gridcolor: grid, zerolinecolor: muted, linecolor: grid, tickfont: { color: muted, size: 11 }, automargin: true });
  return Object.assign({
    title: { text: title, font: { size: 14, color: fg }, x: 0.02, xanchor: "left" },
    paper_bgcolor: css("--bg"), plot_bgcolor: css("--bg"),
    font: { family: css("--font-body"), color: fg },
    margin: { l: 56, r: 16, t: 44, b: 48 },
    legend: { orientation: "h", y: -0.22, font: { size: 11, color: fg } },
    hoverlabel: { bgcolor: css("--surface"), bordercolor: css("--line"), font: { color: fg, family: css("--font-mono"), size: 12 } },
    xaxis: axis(xTitle), yaxis: axis(yTitle),
  }, extra);
}
const errLayout = (title, xTitle, yTitle = "ошибка") => baseLayout(title, xTitle, yTitle, { yaxis: { ...baseLayout().yaxis, tickformat: ".0%", title: { text: yTitle } } });
function identityLine(xs, ys) {
  const all = xs.concat(ys).filter((v) => v != null);
  const lo = Math.min(...all), hi = Math.max(...all);
  return { x: [lo, hi], y: [lo, hi], mode: "lines", name: "y = x", line: { color: css("--muted"), dash: "dash", width: 1 }, hoverinfo: "skip" };
}
function scatterByPart(rows, x, y, hover) {
  const parts = [...new Set(rows.map((r) => r.part))];
  return parts.map((p) => {
    const sub = rows.filter((r) => r.part === p);
    // SVG unless the chart is large: a page may hold only ~16 WebGL contexts.
    return { x: sub.map((r) => r[x]), y: sub.map((r) => r[y]), mode: "markers", type: rows.length > 6000 ? "scattergl" : "scatter", name: PART_LABEL[p] ?? p,
      marker: { color: partColor(p), size: 7, opacity: 0.7, line: { width: 1, color: css("--bg") } },
      text: sub.map(hover), hovertemplate: "%{text}<extra></extra>" };
  });
}
function binnedTraces(bins) {
  const groups = {};
  for (const b of bins) (groups[b.source + "|" + b.part] ||= []).push(b);
  const traces = [];
  for (const [key, list] of Object.entries(groups)) {
    const [source, part] = key.split("|");
    list.sort((a, b) => a.x - b.x);
    const color = partColor(part);
    const name = (PART_LABEL[part] ?? part) + (part === "transfer" ? `: ${sourceLabel(source)}` : "");
    traces.push({ x: list.map((b) => b.x).concat(list.map((b) => b.x).reverse()), y: list.map((b) => b.q75).concat(list.map((b) => b.q25).reverse()),
      fill: "toself", fillcolor: color, opacity: 0.15, line: { width: 0 }, hoverinfo: "skip", showlegend: false, type: "scatter" });
    traces.push({ x: list.map((b) => b.x), y: list.map((b) => b.median), mode: "lines+markers", type: "scatter", name,
      line: { color, width: 2 }, marker: { color, size: 8 },
      customdata: list.map((b) => [b.q25, b.q75, b.n]),
      hovertemplate: "x %{x:.4g}<br>медиана %{y:.1%}<br>IQR %{customdata[0]:.1%} … %{customdata[1]:.1%}<br>n %{customdata[2]}<extra></extra>" });
  }
  return traces;
}
const metric = (what, part, source) => (D.metrics || []).find((r) => r.what === what && r.part === part && (!source || r.source === source));

// ITPS–OTPS: model lines a·ITPS + b·OTPS = 1 for one family, run points and per-run lines.
function budgetChart(family, title, varying) {
  // The local model's train grids (prefill-only S1, decode S2) are synthetic
  // points far off any workload; its charts show test mixes and transfers.
  const P = D.prices, runs = P.runs.filter((r) => r.part !== "unused" && !(D.local && r.part === "train"));
  const lines = P.lines[family];
  const dashes = ["solid", "dash", "dot", "dashdot"];
  const traces = lines.map((l, i) => ({
    type: "scatter", mode: "lines", name: l.reachable === false ? `${l.label} — недостижимо по памяти` : l.label, x: [0, l.itps_max], y: [l.otps_max, 0],
    line: { color: l.reachable === false ? css("--muted") : css("--fg"), width: 1.5, dash: l.reachable === false ? "dot" : dashes[i % 4] },
    hovertemplate: `${l.label}<br>1/ã = %{customdata[0]:,.0f} ток/с<br>1/b̃ = %{customdata[1]:,.1f} ток/с<extra></extra>`,
    customdata: [[l.itps_max, l.otps_max], [l.itps_max, l.otps_max]],
  }));
  // Label the end that varies across the family once per line, the shared end once.
  const ann = [];
  const label = (x, y, text, ax, ay) => ann.push({ x, y, text, showarrow: true, arrowhead: 0, arrowwidth: 1, arrowcolor: css("--muted"), ax, ay, font: { size: 10, color: css("--muted") } });
  lines.forEach((l, i) => {
    if (varying === "itps") label(l.itps_max, 0, `1/ã ${int(l.itps_max)}`, 0, -22 - 14 * i);
    else label(0, l.otps_max, `1/b̃ ${num(l.otps_max, 3)}` + (l.reachable === false ? " — недостижимо по памяти" : ""), 40 + 10 * i, 0);
  });
  if (varying === "itps") label(0, lines[0].otps_max, `1/b̃ ${num(lines[0].otps_max, 3)}`, 46, 0);
  else label(lines[0].itps_max, 0, `1/ã ${int(lines[0].itps_max)}`, 0, -26);
  const own = runs.filter((r) => r.a_model > 0 && r.b_model > 0);
  traces.push({ type: "scatter", mode: "lines", name: "прямые прогонов", visible: "legendonly",
    x: own.flatMap((r) => [0, 1 / r.a_model, null]), y: own.flatMap((r) => [1 / r.b_model, 0, null]),
    line: { color: css("--muted"), width: 1 }, opacity: 0.5, hoverinfo: "skip" });
  for (const cache of ["off", "on"]) for (const sched of [...new Set(runs.map((r) => r.scheduler))]) {
    const sub = runs.filter((r) => r.cache === cache && r.scheduler === sched);
    if (!sub.length) continue;
    traces.push({ type: "scatter", mode: "markers", name: `кэш ${cache} · ${sched}`, x: sub.map((r) => r.ITPS), y: sub.map((r) => r.OTPS),
      marker: { color: cacheColor(cache), symbol: schedSymbol(sched), size: 9, line: { width: 1, color: css("--bg") } },
      text: sub.map((r) => `${r.run_id} · ${sourceLabel(r.source)} (${PART_LABEL[r.part] ?? r.part})<br>ITPS ${int(r.ITPS)}, OTPS ${num(r.OTPS, 3)}<br>ã·ITPS + b̃·OTPS: модель ${num(r.budget_model, 3)}, замер ${num(r.budget_meas, 3)}`),
      hovertemplate: "%{text}<extra></extra>" });
  }
  const xmax = Math.max(...lines.map((l) => l.itps_max), ...runs.map((r) => r.ITPS)) * 1.05;
  const ymax = Math.max(...lines.map((l) => l.otps_max), ...runs.map((r) => r.OTPS)) * 1.08;
  return [traces, baseLayout(title, "ITPS = I / T, входных ток/с", "OTPS = O / T, выходных ток/с",
    { annotations: ann, xaxis: { ...baseLayout().xaxis, range: [0, xmax], title: { text: "ITPS = I / T, входных ток/с" } }, yaxis: { ...baseLayout().yaxis, range: [0, ymax], title: { text: "OTPS = O / T, выходных ток/с" } } })];
}

// One-hue ramp for an ordered variable (R, L, N): darker = larger in light mode, lighter in dark.
const isDark = () => document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
const seqColor = (i, n) => { const t = n > 1 ? i / (n - 1) : 1; return isDark() ? `hsl(212, 75%, ${38 + 42 * t}%)` : `hsl(212, 70%, ${72 - 44 * t}%)`; };
const uniq = (xs) => [...new Set(xs)].sort((a, b) => a - b);
const errBars = (rows) => ({ type: "data", symmetric: false, array: rows.map((r) => r.T_max - r.T), arrayminus: rows.map((r) => r.T - r.T_min), thickness: 1, width: 3 });
const logAxis = (t, base2 = false) => ({ ...baseLayout().xaxis, type: "log", title: { text: t }, ...(base2 ? { dtick: Math.log10(2) } : {}) });
// Measured markers and model dashed lines for each group, one ramp colour per group.
function measuredAndModel(groups, x, y, yHat, name, hover) {
  const traces = [];
  groups.forEach(([key, rows], i) => {
    const color = seqColor(i, groups.length);
    rows.sort((a, b) => a[x] - b[x]);
    traces.push({ type: "scatter", mode: "markers+lines", name: `${name(key)} · замер`, x: rows.map((r) => r[x]), y: rows.map((r) => r[y]),
      line: { color, width: 1 }, marker: { color, size: 8, line: { width: 1, color: css("--bg") } }, legendgroup: String(key),
      text: rows.map(hover), hovertemplate: "%{text}<extra></extra>", ...(rows[0].T_max != null && y === "T" ? { error_y: { ...errBars(rows), color } } : {}) });
    traces.push({ type: "scatter", mode: "lines", name: `${name(key)} · модель`, x: rows.map((r) => r[x]), y: rows.map((r) => r[yHat]),
      line: { color, width: 2, dash: "dash" }, legendgroup: String(key), showlegend: false, hoverinfo: "skip" });
  });
  return traces;
}
const groupBy = (rows, key) => { const m = new Map(); for (const r of rows) { const k = r[key]; if (!m.has(k)) m.set(k, []); m.get(k).push(r); } return [...m.entries()].sort((a, b) => a[0] - b[0]); };

// Sections about the local Qwen3-0.6B collection (own GPU, local_grid_v1).
function renderLocal() {
  const Lc = D.local, c = Lc.conditions;
  const ph = (p) => c.phases.find((x) => x.phase === p) || {};
  let s = section("Локальный прогон: условия сбора",
    `Своя GPU ${c.gpu} (${c.gpu_memory_gb.toFixed(0)} ГБ), TP = ${c.engine.tensor_parallel_size}, eager, частота SM зафиксирована. Две фазы: A — контролируемые сетки (на них подобрана модель) и повтор серверной матрицы, B — смеси по доле prefill и поток запросов; коэффициенты для расчёта точек B взяты из подгонки на A. ` +
    "Каждые 25 попыток — реперный прогон REF (prefix_sweep_set_01, seed 42, без кэша): по нему видны шум и дрейф машины.");
  const tiles = el("div", { class: "tiles" });
  const tile = (label, value, sub) => tiles.append(el("div", { class: "tile" }, el("span", { class: "label" }, label), el("span", { class: "value" }, value), el("span", { class: "sub" }, sub)));
  const all = c.phases.reduce((a, p) => a + p.attempts, 0), ok = c.phases.reduce((a, p) => a + p.success, 0);
  tile("попыток", int(all), `успешных ${int(ok)}, троттлинг ${c.phases.reduce((a, p) => a + p.throttled, 0)}, ошибок ${c.phases.reduce((a, p) => a + p.failed, 0)}`);
  tile("частота SM", `${c.sm_clock_min}–${c.sm_clock_max}`, `МГц во всех попытках; температура до ${c.temperature_max} °C`);
  tile("KV-кэш", `${c.kv_blocks.join(", ")} блоков`, `по ${c.engine.kvcache_block_size} токенов, gpu_memory_utilization ${c.engine.gpu_memory_utilization}`);
  const ref = Lc.reference.stats;
  tile("шум REF", pct(Math.max(...ref.map((r) => r.std_rel)), 2), `std/mean времени прогона; среднее ${ref.map((r) => `${r.phase}: ${num(r.mean, 4)} с`).join(", ")}`);
  tile("время и объём", `${(c.phases.reduce((a, p) => a + p.hours, 0)).toFixed(1)} ч`, `${c.phases.reduce((a, p) => a + p.gigabytes, 0).toFixed(1)} ГБ трасс`);
  s.append(tiles);
  table(s, c.phases, [
    { label: "фаза", key: "phase" }, { label: "попыток", key: "attempts", fmt: int }, { label: "успешных", key: "success", fmt: int },
    { label: "троттлинг", key: "throttled" }, { label: "ошибок", key: "failed" },
    { label: "серии", value: (r) => Object.entries(r.series_counts).map(([k, v]) => `${k} ${v}`).join(", "), text: true },
    { label: "точек отброшено планом", key: "dropped_points", fmt: (v, r) => `${v} (не помещаются в KV или O < 2)` },
    { label: "часов", key: "hours", fmt: (v) => v.toFixed(2) }, { label: "ГБ", key: "gigabytes", fmt: (v) => v.toFixed(1) },
  ]);
  s.append(el("p", { class: "lede mono" }, Object.entries(c.engine).map(([k, v]) => `${k}=${v}`).join(" · ")));
  s.append(el("p", { class: "lede" }, "Дрейф эталонного прогона и разброс повторов — в разделе «Качество данных»."));
  let row;

  // S1: prefill grid.
  const P = Lc.prefill_grid.points;
  s = section("Prefill: сетка S1 (decode = 1)",
    `Один prefill на запрос, \\(O = 1\\): ${P.length} точек × 5 повторов. Точки — медиана по повторам, усы — min…max (разброс повторов: медиана ${pct(Lc.prefill_grid.repeat_spread_median, 2)}); пунктир — модель A с коэффициентами этой модели. ` +
    `Средняя \\(|e|\\) по точкам ${pct(Lc.prefill_grid.mean_abs_e)}. Выше 16 384 токенов prefill режется на куски (chunked prefill). ` +
    (P.some((r) => r.spread > 1) ? `У ${P.filter((r) => r.spread > 1).length} точек повторы расходятся больше чем вдвое — это точки с \\(R \\approx 1\\), где в шаге считается один новый токен: такой шаг похож на decode при \\(B = 1\\) и иногда длится ~0,3 с, как выбросы decode-шагов ниже.` : ""));
  row = chartRow(s);
  const ptHover = (r) => `${r.point_id}<br>k ${r.k}, L ${int(r.L)}, R ${num(r.R, 3)}<br>T ${num(r.T, 4)} с (${num(r.T_min, 4)}…${num(r.T_max, 4)}), T̂ ${num(r.T_hat, 4)} с<br>e ${pct(r.e)}`;
  chart(row, () => {
    const single = P.filter((r) => r.k === 1 && !r.mixed && !(r.cache === "on" && r.R === 0));
    const traces = measuredAndModel(groupBy(single, "R_target"), "L", "T", "T_hat", (k) => `R ≈ ${k}`, ptHover);
    return [traces, baseLayout("Один запрос: T_pf от L при разных R", "L, токены", "T<sub>pf</sub>, с", { xaxis: logAxis("L, токены"), yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "T_pf, с" } } })];
  }, true);
  chart(row, () => {
    const on = P.filter((r) => r.k === 1 && !r.mixed && r.cache === "on");
    const base = new Map(on.filter((r) => r.R === 0).map((r) => [r.L, r]));
    const rows = on.filter((r) => base.has(r.L)).map((r) => ({ ...r, ratio: r.T / base.get(r.L).T, ratio_hat: r.T_hat / base.get(r.L).T_hat }));
    const pick = [1025, 4097, 16385, 36865].filter((L) => rows.some((r) => r.L === L));
    const traces = measuredAndModel(groupBy(rows.filter((r) => pick.includes(r.L)), "L"), "R", "ratio", "ratio_hat", (k) => `L ${int(k)}`, (r) => `${ptHover(r)}<br>T/T(R=0) ${num(r.ratio, 3)}, модель ${num(r.ratio_hat, 3)}`);
    traces.push({ type: "scatter", mode: "lines", name: "1 − R", x: [0, 1], y: [1, 0], line: { color: css("--muted"), dash: "dot", width: 1 }, hoverinfo: "skip" });
    return [traces, baseLayout("Кэш: T_pf(R) / T_pf(R = 0) у одного запроса", "R = C / L", "T(R) / T(R = 0)")];
  }, true);
  row = chartRow(s);
  chart(row, () => {
    const multi = P.filter((r) => r.cache === "off" && !r.mixed);
    const traces = measuredAndModel(groupBy(multi, "L"), "k", "T", "T_hat", (k) => `L ${int(k)}`, ptHover);
    return [traces, baseLayout("k запросов в одном шаге (R = 0)", "k, запросов в prefill-шаге", "T<sub>pf</sub>, с", { xaxis: logAxis("k, запросов в prefill-шаге", true), yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "T_pf, с" } } })];
  }, true);
  chart(row, () => {
    const t = scatterByPart(P.map((r) => ({ ...r, part: r.mixed ? "transfer" : r.cache === "on" ? "test" : "train" })), "L", "e", ptHover);
    t.forEach((tr) => { tr.name = { train: "без кэша", test: "с кэшем", transfer: "hit + miss в шаге" }[tr.name === "перенос" ? "transfer" : tr.name] ?? tr.name; });
    return [t, errLayout("Ошибка модели A по точкам S1", "L, токены", "e = T̂ / T − 1")];
  }, true);
  table(s, [...P].sort((a, b) => Math.abs(b.e) - Math.abs(a.e)), [
    { label: "точка", key: "point_id", text: true, mono: true }, { label: "кэш", key: "cache" }, { label: "k", key: "k" }, { label: "L", key: "L", fmt: int },
    { label: "R", key: "R", fmt: (v) => num(v, 3) }, { label: "шагов", key: "steps" }, { label: "повторов", key: "n" },
    { label: "T, с (медиана)", key: "T", fmt: (v) => num(v, 4) }, { label: "разброс", key: "spread", fmt: (v) => pct(v, 2) },
    { label: "T̂, с", key: "T_hat", fmt: (v) => num(v, 4) }, { label: "e", key: "e", fmt: (v) => pct(v) },
  ], true);

  // S2: decode grid.
  const Q = Lc.decode_grid.points;
  s = section("Decode: сетка S2 (B одинаковых запросов разом)",
    `B одинаковых запросов длины \\(L\\) с \\(O = 256\\) (190 при \\(L = 65\\)): B постоянен на всех decode-шагах прогона, а \\(\\sum\\ell\\) растёт линейно. ${Q.length} точек × 3 повтора; медиана decode-шага, усы — min…max по повторам. ` +
    `Средняя \\(|e|\\) медианного шага ${pct(Lc.decode_grid.mean_abs_e)}. Это и есть ответ на вопрос «N запросов разом»: \\(N = B\\) от 1 до 160.`);
  row = chartRow(s);
  const qHover = (r) => `L ${int(r.L)}, B ${r.B}<br>шаг ${num(r.T * 1e3, 4)} мс (${num(r.T_min * 1e3, 4)}…${num(r.T_max * 1e3, 4)}), модель ${num(r.T_hat * 1e3, 4)} мс<br>e ${pct(r.e)}<br>OTPS ${int(r.otps)}, модель ${int(r.otps_hat)}`;
  chart(row, () => [measuredAndModel(groupBy(Q, "L"), "B", "T", "T_hat", (k) => `L ${int(k)}`, qHover),
    baseLayout("Decode-шаг от B", "B, запросов в шаге", "T<sub>dc</sub>, с (медиана)", { xaxis: logAxis("B, запросов в шаге", true) })], true);
  chart(row, () => [measuredAndModel(groupBy(Q, "L"), "B", "otps", "otps_hat", (k) => `L ${int(k)}`, qHover),
    baseLayout("Выходных токенов в секунду: B / T_dc", "B, запросов в шаге", "OTPS, ток/с", { xaxis: logAxis("B, запросов в шаге", true) })], true);
  table(s, Q, [
    { label: "L", key: "L", fmt: int }, { label: "B", key: "B" }, { label: "повторов", key: "n" },
    { label: "шаг, мс", key: "T", fmt: (v) => num(v * 1e3, 4) }, { label: "модель, мс", key: "T_hat", fmt: (v) => num(v * 1e3, 4) },
    { label: "e", key: "e", fmt: (v) => pct(v) }, { label: "OTPS", key: "otps", fmt: int }, { label: "OTPS модель", key: "otps_hat", fmt: int },
  ], true);

  // S3: prefill-share mixes.
  const M = Lc.mixes;
  s = section("Доля prefill: смеси S3 (test)",
    "Закрытые батчи из N одинаковых запросов, все при t = 0. Длина генерации O подобрана по коэффициентам фазы A так, чтобы prefill занимал 10…90% времени шагов. " +
    `Модель на них не подбиралась — это test. Фактическая доля отличается от заданной на ${pct(M.share_dev_median)} (медиана |Δ|).`);
  row = chartRow(s);
  const ns = uniq(M.runs.map((r) => r.N));
  const byN = (x, y, hover) => ns.map((n, i) => {
    const sub = M.runs.filter((r) => r.N === n);
    return { type: "scatter", mode: "markers", name: `N = ${n}`, x: sub.map((r) => r[x]), y: sub.map((r) => r[y]),
      marker: { color: seqColor(i, ns.length), size: 7, symbol: sub.map((r) => (r.cache === "on" ? "diamond" : "circle")), line: { width: 1, color: css("--bg") } },
      text: sub.map(hover), hovertemplate: "%{text}<extra></extra>" };
  });
  const mHover = (r) => `${r.run_id} · N ${r.N}, L ${r.L}, O ${r.O_req}, кэш ${r.cache}<br>доля prefill: цель ${pct(r.target, 0)}, замер ${pct(r.share)}, модель ${pct(r.share_hat)}<br>e T_total ${pct(r.rel_err)}`;
  chart(row, () => { const t = byN("target", "share", mHover); t.push(identityLine([0, 1], [0, 1])); return [t, baseLayout("Заданная и фактическая доля prefill", "заданная доля", "фактическая доля (Σ prefill-шагов / Σ шагов)", { xaxis: { ...baseLayout().xaxis, tickformat: ".0%", title: { text: "заданная доля" } }, yaxis: { ...baseLayout().yaxis, tickformat: ".0%", title: { text: "фактическая доля" } } })]; }, true);
  chart(row, () => [byN("share", "rel_err", mHover), errLayout("Ошибка T_total от доли prefill", "фактическая доля prefill", "e T_total")], true);
  s.append(el("p", { class: "lede" }, "Ромб — с кэшем (общий префикс, R ≈ 0,5), круг — без кэша."));
  row = chartRow(s);
  table(row, M.by_n, [
    { label: "N", key: "N" }, { label: "прогонов", key: "n" }, { label: "|e| T_total", key: "mean_abs", fmt: (v) => pct(v) },
    { label: "средний знак", key: "mean_signed", fmt: signed }, { label: "доля − цель", key: "share_dev", fmt: (v) => (v > 0 ? "+" : "") + pct(v) },
  ]);
  table(row, M.by_target, [
    { label: "цель", key: "target", fmt: (v) => pct(v, 0) }, { label: "прогонов", key: "n" }, { label: "доля: замер", key: "share", fmt: (v) => pct(v) },
    { label: "доля: модель", key: "share_hat", fmt: (v) => pct(v) }, { label: "|e| T_total", key: "mean_abs", fmt: (v) => pct(v) }, { label: "средний знак", key: "mean_signed", fmt: signed },
  ]);

  // S4: arrivals.
  const A = Lc.arrivals;
  s = section("Приложение Б. Поток запросов S4 (открытый поток, вне постановки «от N»)",
    `${A.requests_per_run} запросов на прогон приходят по Пуассону с интенсивностью \\(\\rho \\cdot ${num(A.capacity_rps, 3)}\\) запросов/с; ρ — номинальная доля плана фазы B, а не доля измеренной или предсказанной ёмкости; длины как в prefix_sweep, у запросов 4 семьи общих префиксов. ` +
    `Число ${num(A.capacity_rps, 3)} посчитано до сбора (local_grid._s4) по ценам формулы 5 с коэффициентами фазы A: \\(1 / (\\tilde a \\bar L + \\tilde b \\bar O)\\), \\(\\tilde a\\) — для одного запроса средней длины \\(\\bar L = 2305\\) без кэша (\\(R = 0\\), и в вариантах с кэшем тоже), \\(\\tilde b\\) — для decode-шага с \\(B = 16\\) и \\(\\ell = \\bar L + \\bar O/2\\). Это не измеренный потолок: у fixed_batch батч не больше 8, а с кэшем prefill дешевле, поэтому реальный излом у вариантов разный (ниже). ` +
    "fixed_batch — волнами по 8: новая волна ждёт конца предыдущей. TTFT по модели — предсказанные шаги от прихода запроса до его первого токена по расписанию трассы (ожидание из трассы). Открытый поток вне постановки «от N»: здесь число запросов в системе не задано, а растёт с очередью.");
  row = chartRow(s);
  const combos = [...new Set(A.table.map((r) => `${r.scheduler}|${r.cache}`))];
  chart(row, () => {
    const traces = [];
    combos.forEach((key) => {
      const [sched, cache] = key.split("|"), sub = A.table.filter((r) => r.scheduler === sched && r.cache === cache).sort((a, b) => a.rho - b.rho);
      const color = cacheColor(cache);
      traces.push({ type: "scatter", mode: "markers+lines", name: `${sched} · кэш ${cache} · замер`, x: sub.map((r) => r.rho), y: sub.map((r) => r.ttft),
        line: { color, width: 1.5, dash: sched.startsWith("fixed") ? "dot" : "solid" }, marker: { color, symbol: schedSymbol(sched), size: 9 },
        text: sub.map((r) => `ρ ${r.rho}, ${sched}, кэш ${cache}<br>TTFT медиана: замер ${num(r.ttft, 3)} с, модель ${num(r.ttft_hat, 3)} с<br>p90 ${num(r.ttft_p90, 3)} с`), hovertemplate: "%{text}<extra></extra>" });
      traces.push({ type: "scatter", mode: "markers", name: `${sched} · кэш ${cache} · модель`, x: sub.map((r) => r.rho), y: sub.map((r) => r.ttft_hat),
        marker: { color, symbol: schedSymbol(sched) + "-open", size: 12, line: { width: 1.5, color } }, showlegend: false, hoverinfo: "skip" });
    });
    return [traces, baseLayout("TTFT (медиана) от нагрузки", "ρ — номинальная доля плана фазы B", "TTFT, с", { yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "TTFT, с (лог)" } } })];
  }, true);
  chart(row, () => {
    const traces = combos.map((key) => {
      const [sched, cache] = key.split("|"), sub = A.runs.filter((r) => r.scheduler === sched && r.cache === cache);
      return { type: "scatter", mode: "markers", name: `${sched} · кэш ${cache}`, x: sub.map((r) => r.offered_rps), y: sub.map((r) => r.achieved_rps),
        marker: { color: cacheColor(cache), symbol: schedSymbol(sched), size: 9, line: { width: 1, color: css("--bg") } },
        text: sub.map((r) => `${r.run_id}<br>предложено ${num(r.offered_rps, 3)}, обслужено ${num(r.achieved_rps, 3)} запросов/с<br>e T_total ${pct(r.rel_err)}`), hovertemplate: "%{text}<extra></extra>" };
    });
    traces.push(identityLine(A.runs.map((r) => r.offered_rps), A.runs.map((r) => r.offered_rps)));
    return [traces, baseLayout("Предложенная и обслуженная нагрузка", "предложено, запросов/с", "обслужено = запросов / T^wall")];
  }, true);
  table(s, A.table, [
    { label: "ρ", key: "rho" }, { label: "планировщик", key: "scheduler", text: true }, { label: "кэш", key: "cache" }, { label: "прогонов", key: "n" },
    { label: "предложено, зап/с", key: "offered_rps", fmt: (v) => num(v, 3) }, { label: "обслужено, зап/с", key: "achieved_rps", fmt: (v) => num(v, 3) },
    { label: "TTFT замер, с", key: "ttft", fmt: (v) => num(v, 3) }, { label: "TTFT модель, с", key: "ttft_hat", fmt: (v) => num(v, 3) },
    { label: "TTFT p90, с", key: "ttft_p90", fmt: (v) => num(v, 3) }, { label: "e T_total", key: "rel_err", fmt: (v) => pct(v) },
  ], true);
  s.append(el("h3", {}, "TTPS–TTFT в открытом потоке"));
  s.append(el("p", { class: "lede" }, el("strong", {}, "Открытый поток: за изломом точки показывают очередь, а не работу модели. "),
    `Точки, где обслужено меньше ${pct(A.stationary_share, 0)} предложенного, затенены: там очередь растёт весь прогон и TTFT зависит от длины прогона. Кривая TTPS–TTFT по конкурентности — в разделе S5 и в «Итоговых графиках». Линии — по возрастанию ρ для каждой пары (планировщик, кэш), подпись — ρ; модель — пунктир с полыми точками.`));
  row = chartRow(s);
  chart(row, s4TtpsChart("ttft", "ttft_hat", "S4: TTPS от медианы TTFT по ρ", "TTFT, с (медиана, лог)"), true);
  chart(row, s4TtpsChart("ttft_p90", "ttft_hat_p90", "S4: TTPS от p90 TTFT по ρ", "TTFT, с (p90, лог)"), true);
  renderKnee(s);
  if (Lc.closed_loop) renderClosedLoop();

  // S0: the server matrix on this GPU.
  const Sv = Lc.server;
  s = section("Приложение В. Та же нагрузка, что на сервере: S0",
    `48 прогонов серверной матрицы Qwen3-0.6B (6 наборов × 2 зерна × 4 условия, max_num_seqs = 8) на этой GPU. Здесь прогон в ${num(1 / Sv.ratio_median, 3)} раза быстрее (медиана отношения ${num(Sv.ratio_median, 3)}): TP = 1 без обмена между GPU, ` +
    "своя машина без чужих задач. Ошибка — модели этой GPU без подгонки на S0.");
  row = chartRow(s);
  chart(row, () => {
    const conds = [...new Set(Sv.runs.map((r) => r.condition_id))].sort();
    const traces = conds.map((cId) => {
      const sub = Sv.runs.filter((r) => r.condition_id === cId);
      return { type: "scatter", mode: "markers", name: `${cId}: кэш ${sub[0].cache} · ${sub[0].scheduler}`, x: sub.map((r) => r.server_wall), y: sub.map((r) => r.wall_seconds),
        marker: { color: cacheColor(sub[0].cache), symbol: schedSymbol(sub[0].scheduler), size: 9, line: { width: 1, color: css("--bg") } },
        text: sub.map((r) => `${r.run_id} = сервер ${r.server_run_id}<br>сервер ${num(r.server_wall, 4)} с, здесь ${num(r.wall_seconds, 4)} с (×${num(r.ratio, 3)})<br>e модели ${pct(r.rel_err)}`), hovertemplate: "%{text}<extra></extra>" };
    });
    const xs = Sv.runs.map((r) => r.server_wall), hi = Math.max(...xs);
    traces.push({ type: "scatter", mode: "lines", name: `y = ${num(Sv.ratio_median, 3)} x`, x: [0, hi], y: [0, hi * Sv.ratio_median], line: { color: css("--muted"), dash: "dash", width: 1 }, hoverinfo: "skip" });
    return [traces, baseLayout("Время прогона: сервер и эта GPU", "сервер (2× RTX A4000, TP = 2), с", "эта GPU, с")];
  }, true);
  table(s, Sv.by_condition, [
    { label: "условие", key: "condition_id" }, { label: "кэш", key: "cache" }, { label: "планировщик", key: "scheduler", text: true },
    { label: "прогонов", key: "n" }, { label: "здесь / сервер", key: "ratio", fmt: (v) => num(v, 3) }, { label: "e модели (среднее)", key: "e", fmt: (v) => pct(v) },
  ]);
}

const signShort = (v) => (v == null ? "—" : (v > 0 ? "+" : "") + pct(v));
const partName = (r) => `${sourceLabel(r.source)} · ${PART_LABEL[r.part] ?? r.part}`;

// Prefill and decode checks on every data set of the model.
function renderChecks() {
  const P = D.prefill_checks;
  let s = section("Prefill: проверки на всех данных",
    "Одиночный запрос без кэша, модель без кэша на шагах с кэшем, несколько запросов в одном шаге и шаги с малым числом новых токенов. Модель и коэффициенты — основные, кроме проверки кэша.");
  let row = chartRow(s);
  chart(row, () => {
    const t = scatterByPart(P.single, "L_sum", "T", (r) => `${r.run_id} · ${sourceLabel(r.source)}<br>L ${int(r.L_sum)}<br>T ${num(r.T, 4)} с, модель ${num(r.pred, 4)} с`);
    t.push({ type: "scatter", mode: "lines", name: "модель: aL + bL² + c", x: P.curve.L, y: P.curve.T, line: { color: css("--fg"), width: 2 }, hoverinfo: "skip" });
    return [t, baseLayout(`Один запрос, R = 0: T(L) (${int(P.single_n)} шагов)`, "L, токены", "T<sub>pf</sub>, с", { xaxis: logAxis("L, токены"), yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "T_pf, с" } } })];
  }, true);
  if (P.multi.length) {
    const groups = groupBy(P.multi, "L");
    const mHover = (r) => `${sourceLabel(r.source)} · L ${int(r.L)}, k ${r.k}<br>T ${num(r.T, 4)} с, модель ${num(r.pred, 4)} с<br>T/k ${num(r.T_per, 4)} с, модель ${num(r.pred_per, 4)} с<br>шагов ${r.n}`;
    chart(row, () => [measuredAndModel(groupBy(P.multi, "L"), "k", "T", "pred", (k) => `L ${int(k)}`, mHover),
      baseLayout("k одинаковых запросов в шаге: T", "k, запросов в шаге", "T<sub>pf</sub>, с (медиана)", { xaxis: logAxis("k, запросов в шаге", true), yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "T_pf, с" } } })], true);
    chart(row, () => [measuredAndModel(groups, "k", "T_per", "pred_per", (k) => `L ${int(k)}`, mHover),
      baseLayout("k одинаковых запросов в шаге: T / k", "k, запросов в шаге", "T / k, с на запрос", { xaxis: logAxis("k, запросов в шаге", true), yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "T / k, с" } } })], true);
  } else s.append(el("p", { class: "lede" }, "Шагов с несколькими запросами одной длины без кэша в этих данных нет — зависимость от k не проверить."));
  s.append(el("h3", {}, "Кэш: модель без кэша на шагах с кэшем"));
  if (P.cache) {
    s.append(el("p", { class: "lede" }, `Модель A подобрана заново (NNLS) только на шагах train-набора без попаданий в кэш (\\(R_{\\text{кэш}} = 0\\); готовый KV своего куска допускается): ${coefText(P.cache.coef)}. ` +
      "Ею предсказаны все шаги с \\(R_{\\text{кэш}} > 0\\). Если формула \\(L(1 - R)\\), \\(L^2(1 - R^2)\\) верно описывает кэш, ошибка здесь такая же, как без кэша. Ячейка — средняя \\(e\\) и число шагов; \\(L\\) — средняя длина запроса в шаге."));
    table(s, P.cache.by_source, [
      { label: "данные", value: (r) => sourceLabel(r.source), text: true }, { label: "шагов", key: "n", fmt: int },
      { label: "средняя |e|", key: "mean_abs", fmt: (v) => pct(v) }, { label: "медиана |e|", key: "median_abs", fmt: (v) => pct(v) }, { label: "средний знак", key: "mean_signed", fmt: signed },
    ]);
    for (const src of (D.sources || []).map((x) => x.id).filter((id) => P.cache.table.some((r) => r.source === id))) {
      const sub = P.cache.table.filter((r) => r.source === src);
      const rBins = [...new Set(sub.map((r) => r.R_bin))].sort(), lBins = [...new Set(sub.map((r) => r.L_bin))].sort((a, b) => parseInt(a) - parseInt(b));
      s.append(el("p", {}, el("strong", {}, sourceLabel(src))));
      table(s, lBins.map((lb) => ({ lb, cells: Object.fromEntries(sub.filter((r) => r.L_bin === lb).map((r) => [r.R_bin, r])) })), [
        { label: "L \\ R_кэш", key: "lb", text: true },
        ...rBins.map((rb) => ({ label: rb, value: (row) => { const c = row.cells[rb]; return c ? `${signShort(c.e)} (${c.n})` : "—"; } })),
      ]);
    }
  } else s.append(el("p", { class: "lede" }, "Нет данных: попаданий в кэш префиксов здесь нет (\\(R_{\\text{кэш}} = 0\\) у всех шагов). Готовый KV своего куска (\\(R_{\\text{нарезка}}\\)) проверяется в разделе ошибок от L и R."));
  s.append(el("h3", {}, `Шаги, где новых токенов меньше ${P.small_threshold}`));
  if (P.small.length) {
    s.append(el("p", { class: "lede" }, `${int(P.small_n)} шагов: в шаге почти нечего считать (запрос почти целиком в кэше, короткий хвост куска). Модель даёт почти постоянную \\(c\\); замер показывает, сколько стоит такой шаг на деле.`));
    row = chartRow(s);
    chart(row, () => {
      const t = scatterByPart(P.small, "new", "T", (r) => `${r.run_id} · ${sourceLabel(r.source)}<br>новых ${r.new}, k ${r.k}, L ${int(r.L_sum)}, R_кэш ${num(r.R_cache, 3)}<br>T ${num(r.T * 1e3, 4)} мс, модель ${num(r.pred * 1e3, 4)} мс`);
      t.push({ type: "scatter", mode: "markers", name: "модель", x: P.small.map((r) => r.new), y: P.small.map((r) => r.pred), marker: { color: css("--fg"), symbol: "line-ew-open", size: 10, line: { width: 2, color: css("--fg") } }, hoverinfo: "skip" });
      return [t, baseLayout("Время шага от числа новых токенов", "новых токенов в шаге", "T<sub>pf</sub>, с", { yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "T_pf, с (лог)" } } })];
    }, true);
  } else s.append(el("p", { class: "lede" }, "Таких шагов нет."));

  s = section("Decode: проверки на всех данных",
    "Сетка средняя длина контекста \\(\\bar\\ell = \\sum\\ell / B\\) (полосы по степеням двойки) × \\(B\\): медианы замера и модели и средняя \\(e\\) по всем decode-шагам. Ниже — время шага от \\(\\sum\\ell\\), цвет — \\(B\\) (выборка до 2500 шагов на набор).");
  const srcOrder = (id) => (D.sources || []).findIndex((x) => x.id === id);
  table(s, [...D.decode_checks].sort((a, b) => srcOrder(a.source) - srcOrder(b.source)), [
    { label: "данные", value: partName, text: true }, { label: "ℓ̄", key: "ell_bin" }, { label: "B", key: "B_band" }, { label: "шагов", key: "n", fmt: int },
    { label: "замер, мс", key: "T", fmt: (v) => num(v * 1e3, 4) }, { label: "модель, мс", key: "pred", fmt: (v) => num(v * 1e3, 4) }, { label: "e (среднее)", key: "e", fmt: signShort },
  ], true);
  row = chartRow(s);
  for (const src of D.sources || []) {
    const pts = D.decode_sample.filter((r) => r.source === src.id && r.part !== "unused");
    if (!pts.length) continue;
    chart(row, () => {
      const bmax = Math.max(...pts.map((r) => r.B));
      // Rare step outliers (see «Качество данных») would flatten the cloud: cap the axis at 1.5 × p99.
      const ts = pts.map((r) => r.T * 1e3).sort((a, b) => a - b), top = ts[Math.floor(0.99 * (ts.length - 1))] * 1.5;
      return [[{ type: "scatter", mode: "markers", name: "замер", x: pts.map((r) => r.sum_l), y: pts.map((r) => r.T * 1e3),
        marker: { size: 5, opacity: 0.7, color: pts.map((r) => Math.log2(r.B)), cmin: 0, cmax: Math.max(1, Math.log2(bmax)),
          colorscale: [[0, isDark() ? "hsl(212, 75%, 38%)" : "hsl(212, 70%, 80%)"], [1, isDark() ? "hsl(212, 75%, 85%)" : "hsl(212, 70%, 25%)"]],
          colorbar: { title: { text: "B", font: { size: 11, color: css("--muted") } }, tickvals: [0, 1, 2, 3, 4, 5, 6, 7].filter((v) => v <= Math.log2(bmax) + 0.01), ticktext: ["1", "2", "4", "8", "16", "32", "64", "128"], outlinewidth: 0, tickfont: { color: css("--muted") } } },
        text: pts.map((r) => `${r.run_id}<br>B ${r.B}, Σℓ ${int(r.sum_l)}<br>T ${num(r.T * 1e3, 4)} мс, модель ${num(r.pred * 1e3, 4)} мс`), hovertemplate: "%{text}<extra></extra>" }],
        baseLayout(`Decode-шаг от Σℓ: ${src.label}`, "Σℓ, токены", "T<sub>dc</sub>, мс", { showlegend: false, yaxis: { ...baseLayout().yaxis, range: [0, top], title: { text: "T_dc, мс (выше 1,5 × p99 — выбросы, не показаны)" } } })];
    }, true);
  }
}

// Data quality: time outside steps, step outliers, repeats and drift.
function renderQuality() {
  const Q = D.quality;
  const s = section("Качество данных",
    "Время вне шагов: \\(1 - \\sum T_{\\text{шагов}} / T^{\\mathrm{wall}}\\) — промежутки между шагами и время до и после цикла, которые модель не описывает. Выбросы — шаги намного дольше своих соседей." +
    (D.local ? " Для локальных данных — ещё разброс одинаковых повторов и дрейф эталонного прогона. У потока S4 время вне шагов — в основном простой GPU между приходами запросов, так и задумано." : ""));
  let row = chartRow(s);
  chart(row, () => [scatterByPart(Q.off_steps, "wall_seconds", "off_share", (r) => `${r.run_id} · ${sourceLabel(r.source)}<br>T^wall ${num(r.wall_seconds, 4)} с, шаги ${num(r.steps_seconds, 4)} с<br>вне шагов ${pct(r.off_share, 2)}`),
    baseLayout("Доля времени вне шагов от длительности прогона", "T^wall, с (лог)", "1 − Σ T_шагов / T^wall", { xaxis: logAxis("T^wall, с (лог)"), yaxis: { ...baseLayout().yaxis, tickformat: ".1%", title: { text: "1 − Σ T_шагов / T^wall" } } })], true);
  if (D.local) {
    const Lc = D.local;
    chart(row, () => {
      const runs = Lc.reference.runs;
      const traces = ["A", "B"].map((p, i) => {
        const sub = runs.filter((r) => r.phase === p);
        return { type: "scatter", mode: "markers", name: `фаза ${p}`, x: sub.map((r) => r.minutes), y: sub.map((r) => r.wall),
          marker: { color: css(i ? "--m3" : "--m1"), size: 8, line: { width: 1, color: css("--bg") } }, text: sub.map((r) => `${r.run_id}<br>${num(r.wall, 4)} с`), hovertemplate: "%{text}<extra></extra>" };
      });
      return [traces, baseLayout("Дрейф: эталонный прогон REF за весь сбор", "минуты от первого REF", "T<sup>wall</sup>, с")];
    }, true);
    s.append(el("h3", {}, "Разброс одинаковых повторов"));
    table(s, Lc.repeat_spread, [
      { label: "серия", key: "series", text: true }, { label: "что сравнивается", key: "what", text: true }, { label: "точек", key: "points" },
      { label: "(max − min) / медиана: медиана", key: "median", fmt: (v) => pct(v, 2) }, { label: "p90", key: "p90", fmt: (v) => pct(v, 2) }, { label: "максимум", key: "max", fmt: (v) => pct(v, 1) },
    ]);
    const reps = Lc.prefill_grid.repeats || [];
    if (reps.length) {
      const slow = (id) => reps.filter((r) => r.point_id === id && r.prefill_seconds > 0.1).length;
      const worst = [...new Set(reps.map((r) => r.point_id))].sort((a, b) => slow(b) - slow(a))[0];
      s.append(el("p", {}, `Точки S1, где повторы расходятся больше чем вдвое — все с \\(R \\approx 1\\): в шаге считается один новый токен. Каждый повтор отдельно. ` +
        `Хуже всех ${worst}: долгий шаг (> 0,1 с) в ${slow(worst)} повторах из ${reps.filter((r) => r.point_id === worst).length}, поэтому у неё и медиана ~0,3 с; у остальных — в одном повторе.`));
      table(s, [...reps].sort((a, b) => slow(b.point_id) - slow(a.point_id) || a.point_id.localeCompare(b.point_id)), [
        { label: "точка", key: "point_id", text: true, mono: true }, { label: "прогон", key: "run_id", mono: true }, { label: "L", key: "L", fmt: int },
        { label: "R", key: "R", fmt: (v) => num(v, 4) }, { label: "prefill-шагов", key: "n_prefill_steps" },
        { label: "T_pf, мс", key: "prefill_seconds", fmt: (v) => num(v * 1e3, 4) }, { label: "модель, мс", key: "prefill_hat", fmt: (v) => num(v * 1e3, 4) },
      ], true);
    }
  }
  const Sp = Q.spikes;
  s.append(el("h3", {}, "Выбросы decode-шагов"));
  s.append(el("p", { class: "lede" }, `Шаг дольше ${Sp.seconds} с и в ${Sp.ratio} раз медианы своего прогона при том же B. Доля времени — сколько выбросы добавили к сумме decode-шагов.`));
  table(s, Sp.by_source, [
    { label: "данные", key: "source", text: true }, { label: "decode-шагов", key: "steps", fmt: int }, { label: "выбросов", key: "spikes", fmt: int },
    { label: "доля шагов", key: "rate", fmt: (v) => pct(v, 3) }, { label: "прогонов с выбросом", value: (r) => `${r.runs_with_spike} из ${r.runs}` },
    { label: "медиана, с", key: "T_median", fmt: (v) => num(v, 3) }, { label: "максимум, с", key: "T_max", fmt: (v) => num(v, 3) }, { label: "доля времени", key: "time_share", fmt: (v) => pct(v, 2) },
    { label: "из них первый decode-шаг", key: "first_step_share", fmt: (v) => pct(v, 0) }, { label: "из них B = 1", key: "B1_share", fmt: (v) => pct(v, 0) },
  ]);
  if (Sp.top.length) table(s, Sp.top, [
    { label: "данные", key: "source", text: true }, { label: "прогон", key: "run_id", mono: true }, { label: "шаг", key: "step_index" }, { label: "B", key: "B" }, { label: "Σℓ", key: "sum_l", fmt: int },
    { label: "T, с", key: "T", fmt: (v) => num(v, 3) }, { label: "медиана прогона, мс", key: "base", fmt: (v) => num(v * 1e3, 3) },
  ]);
}

// S4 past the knee: non-stationary points, TTFT along the run, the model's
// saturation throughput and the TPOT split of upstream_dynamic without cache.
// S4: one line per (scheduler, cache) over ρ; dashed line with open markers —
// model. Points past the knee (served < 95% of offered) are shaded: a queue.
function s4TtpsChart(xKey, xHatKey, title, xTitle) {
  return () => {
    const A = D.local.arrivals;
    const knee = new Map(A.table.map((r) => [`${r.rho}|${r.scheduler}|${r.cache}`, r]));
    const isLate = (g) => knee.get(`${g.rho}|${g.scheduler}|${g.cache}`)?.stationary === false;
    const s4 = (D.request_groups || []).filter((g) => g.ttps != null && g.rho != null);
    const traces = [];
    for (const key of [...new Set(s4.map((g) => `${g.scheduler}|${g.cache}`))]) {
      const [sched, cache] = key.split("|");
      const sub = s4.filter((g) => g.scheduler === sched && g.cache === cache).sort((a, b) => a.rho - b.rho);
      const color = cacheColor(cache), symbol = schedSymbol(sched), name = `${sched} · кэш ${cache}`;
      const op = sub.map((g) => (isLate(g) ? 0.25 : 1));
      const text = sub.map((g) => `${name} · ρ ${g.rho}${isLate(g) ? " — за изломом: очередь, а не работа модели" : ""}<br>${g.n} запросов в ${g.runs} прогонах<br>TTFT медиана: замер ${num(g.ttft, 3)} с, модель ${num(g.ttft_hat, 3)} с<br>TTFT p90: замер ${num(g.ttft_p90, 3)} с, модель ${num(g.ttft_hat_p90, 3)} с<br>TTPS: замер ${num(g.ttps, 3)}, модель ${num(g.ttps_hat, 3)} ток/с`);
      traces.push({ type: "scatter", mode: "lines+markers+text", name: `${name} · замер`, legendgroup: key, x: sub.map((g) => g[xKey]), y: sub.map((g) => g.ttps),
        text: sub.map((g) => `ρ ${g.rho}`), textposition: "top center", textfont: { size: 10, color: css("--muted") }, customdata: text, hovertemplate: "%{customdata}<extra></extra>",
        line: { color, width: 1.5, dash: sched.startsWith("fixed") ? "dot" : "solid" }, opacity: 0.85, marker: { color, symbol, size: 10, opacity: op, line: { width: 1, color: css("--bg") } } });
      traces.push({ type: "scatter", mode: "lines+markers", name: `${name} · модель`, legendgroup: key, showlegend: false, x: sub.map((g) => g[xHatKey]), y: sub.map((g) => g.ttps_hat),
        customdata: text, hovertemplate: "%{customdata}<extra></extra>", line: { color, width: 1, dash: "dash" }, marker: { color, symbol: symbol + "-open", size: 10, opacity: op, line: { width: 1.5, color } } });
    }
    traces.push({ type: "scatter", mode: "markers", name: "затенено — за изломом, нестационарно", x: [null], y: [null], marker: { color: css("--muted"), size: 10, opacity: 0.25 } });
    traces.push({ type: "scatter", mode: "lines+markers", name: "модель (пунктир, полые точки)", x: [null], y: [null], line: { color: css("--muted"), dash: "dash" }, marker: { color: css("--muted"), symbol: "circle-open", size: 9 } });
    return [traces, baseLayout(title, xTitle, "TTPS = 1 / TPOT, ток/с (медиана)", { xaxis: { ...baseLayout().xaxis, type: "log", title: { text: xTitle } } })];
  };
}

// S5 closed loop: one line per variant (scheduler, cache) over N.
const s5Variants = () => { const T = D.local.closed_loop.table; return [...new Set(T.map((r) => `${r.scheduler}|${r.cache}`))].map((k) => k.split("|")); };
const s5Rows = (sched, cache) => D.local.closed_loop.table.filter((r) => r.scheduler === sched && r.cache === cache).sort((a, b) => a.N - b.N);
const s5Name = (sched, cache) => `${sched} · кэш ${cache}`;
const s5Line = (sched) => (sched.startsWith("fixed") ? "dot" : "solid");
function s5Hover(r) {
  return `${s5Name(r.scheduler, r.cache)} · N ${r.N} (${r.n} повт.)<br>RPS ${num(r.rps, 3)} ± ${num(r.rps_sd, 2)}, модель ${num(r.rps_hat, 3)}<br>ITPS новые ${int(r.itps)}, все ${int(r.itps_all)} · OTPS ${int(r.otps)}<br>` +
    `TTFT медиана ${num(r.ttft, 3)} с (модель ${num(r.ttft_hat, 3)}), p90 ${num(r.ttft_p90, 3)} с<br>TTPS ${num(r.ttps, 3)} (модель ${num(r.ttps_hat, 3)}) ток/с<br>батч ${num(r.batch, 3)}, KV ${pct(r.kv_max)}, вытеснений ${num(r.preempted, 3)}`;
}
function s5TtpsChart(xKey, xHatKey, title, xTitle) {
  return () => {
    const traces = [];
    for (const [sched, cache] of s5Variants()) {
      const sub = s5Rows(sched, cache), color = cacheColor(cache), symbol = schedSymbol(sched), key = `${sched}|${cache}`;
      traces.push({ type: "scatter", mode: "lines+markers+text", name: `${s5Name(sched, cache)} · замер`, legendgroup: key, x: sub.map((r) => r[xKey]), y: sub.map((r) => r.ttps),
        text: sub.map((r) => `N ${r.N}`), textposition: "top center", textfont: { size: 10, color: css("--muted") }, customdata: sub.map(s5Hover), hovertemplate: "%{customdata}<extra></extra>",
        line: { color, width: 2, dash: s5Line(sched) }, marker: { color, symbol, size: 10, line: { width: 1, color: css("--bg") } } });
      traces.push({ type: "scatter", mode: "lines+markers", name: `${s5Name(sched, cache)} · модель`, legendgroup: key, showlegend: false, x: sub.map((r) => r[xHatKey]), y: sub.map((r) => r.ttps_hat),
        customdata: sub.map(s5Hover), hovertemplate: "%{customdata}<extra></extra>", line: { color, width: 1.5, dash: "dash" }, marker: { color, symbol: symbol + "-open", size: 10, line: { width: 1.5, color } } });
    }
    traces.push({ type: "scatter", mode: "lines+markers", name: "модель (пунктир, полые точки)", x: [null], y: [null], line: { color: css("--muted"), dash: "dash" }, marker: { color: css("--muted"), symbol: "circle-open", size: 9 } });
    return [traces, baseLayout(title, xTitle, "TTPS = 1 / TPOT, ток/с (медиана)", { xaxis: { ...baseLayout().xaxis, type: "log", title: { text: xTitle } } })];
  };
}
// y(N) for each variant: measured with spread over the seeds, model dashed;
// a vertical mark at the N where the KV cache fills (preemption or ≥ 95%).
function s5ByN(key, title, yTitle, model = true) {
  return () => {
    const CL = D.local.closed_loop, traces = [], shapes = [], ann = [];
    for (const [sched, cache] of s5Variants()) {
      const sub = s5Rows(sched, cache), color = cacheColor(cache), symbol = schedSymbol(sched), g = `${sched}|${cache}`;
      const sd = sub.map((r) => r[key + "_sd"]);
      traces.push({ type: "scatter", mode: "lines+markers", name: `${s5Name(sched, cache)} · замер`, legendgroup: g, x: sub.map((r) => r.N), y: sub.map((r) => r[key]),

function renderKnee(s) {

    "обслужено — запросов в секунду от первого прихода до последнего ответа. Среднее по 3 зёрнам. За изломом очередь растёт весь прогон, и медиана TTFT зависит от длины прогона, а не только от ρ."));
  table(s, A.table, [

    { label: "номинально, зап/с", key: "nominal_rps", fmt: (v) => num(v, 3) }, { label: "предложено, зап/с", key: "offered_rps", fmt: (v) => num(v, 3) },

// The summary of every check over every data set, shown above any model.
function summaryTable() {
  const cells = DOC.summary || [];
  if (!cells.length) return null;
  const columns = [...new Set(cells.map((c) => c.column))];
  const flags = {};
  for (const m of DOC.models) {
    for (const c of cells.filter((x) => x.model === m.label)) {
      const src = (m.sources || []).find((x) => c.column.startsWith(x.label + " · "));
      const note = src?.caveat || m.caveat;
      if (note) flags[c.column] = note;
    }
  }
  const rows = [...new Set(cells.map((c) => c.check))];
  const wrap = el("section", {}, el("h2", {}, "Что проверено и с какой ошибкой"),
    el("p", { class: "lede" }, "По всем наборам данных, без новой подгонки основной модели. В ячейке: средняя \\(|e|\\) / медиана \\(|e|\\), ниже — средний знак \\(e\\) и число шагов, прогонов, окон или запросов. Смеси — окна по времени с долей prefill 30–70%, ошибка \\(x + y - 1\\). " +
      "Наборы: сначала локальные (чистая машина), затем сервер 8B, затем сервер 0.6B. У локальной модели train — сетки S1–S2, test — смеси S3."));
  const head = el("tr", {}, el("th", { class: "text" }, "проверка"), ...columns.map((c) => el("th", { class: "text" }, c + (flags[c] ? ` — ${flags[c]}` : ""))));
  const body = rows.map((check) => el("tr", {}, el("td", { class: "text" }, check), ...columns.map((col) => {
    const c = cells.find((x) => x.check === check && x.column === col);
    const td = el("td", { class: flags[col] ? "muted" : "" });
    if (!c || !c.n) td.textContent = "нет данных";
    else td.append(el("strong", {}, `${pct(c.mean_abs)} / ${pct(c.median_abs)}`), el("br"), `${signShort(c.mean_signed)} · n ${int(c.n)}`);
    return td;
  })));
  wrap.append(el("div", { class: "table-wrap" }, el("table", { class: "summary" }, el("thead", {}, head), el("tbody", {}, ...body))));
  return wrap;
}

function sysButtons(parent, items, current, onPick, label) {

  const S = D.local.system, V = S.variants, ch = S.choice;
  const W = S.workloads;
  sysState.key ??= (W.find((w) => w.key === "S5|upstream_dynamic|on") || W[0]).key;

  // 1. What the model predicts.
  let s = section("Модель «от N»: что предсказывает",
