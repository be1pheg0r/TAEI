    `(${S.engine.kv_blocks} блоков KV по ${S.engine.block_size} токенов, max_num_seqs ${S.engine.max_num_seqs}, max_num_batched_tokens ${int(S.engine.max_batched_tokens)}, волна fixed_batch ${S.engine.wave}) и планировщик. ` +
    "Выход — RPS, ITPS (новые, полный вход), OTPS, TTFT p50 и p90, TPOT и TTPS как функции N. Ни одна величина из трассы во вход не идёт; модель времени шага — кирпич. " +
    `Проверка — только прогноз против замера на S5 (фазы C и D) и S8 W1–W4: по ним ничего не подбирается. Вариант decode — ${V[ch].label}, выбран по ошибке шага (train и test S3).`);
  const sum = S.summary.filter((r) => r.variant === ch);
  const all = (region) => sum.find((r) => r.load === "все" && r.region === region);
  const tiles = el("div", { class: "tiles" });
  const tile = (label, value, sub) => tiles.append(el("div", { class: "tile" }, el("span", { class: "label" }, label), el("span", { class: "value" }, value), el("span", { class: "sub" }, sub)));
  for (const region of ["below", "above"]) {
    const r = all(region);
    if (r) tile(`RPS, ${REGION[region]}`, pct(r.rps_abs), `средняя |e| по ${r.points} точкам; TTFT p50 ${pct(r.ttft_p50_abs)}, TPOT ${pct(r.tpot_abs)}`);
  }
  const kn = S.special.knee;
  tile("колено KV", pct(Math.max(...kn.map((k) => Math.abs(k.e)))), `максимум |e| B_KV по ${kn.length} вариантам; медиана ${pct(kn.map((k) => Math.abs(k.e)).sort((a, b) => a - b)[Math.floor(kn.length / 2)])}`);
  tile("κ", num(S.kappa.value, 3), `цена повторённого токена префикса в decode (1 — как обычный), ${S.kappa.points} попыток S7`);
  s.append(tiles);
  s.append(el("h3", {}, `Ошибка прогноза системы (${V[ch].label})`));
  s.append(el("p", { class: "lede" }, "e = (прогноз − замер)/замер по точкам (N, нагрузка, планировщик, кэш; среднее по повторам). В ячейке — средняя |e| и средний знак. Ниже колена — N не больше колена KV по факту (для fixed_batch — не больше волны), выше — остальные точки."));
  const cell = (k) => ({ label: METRIC_LABEL[k], value: (r) => (r[`${k}_abs`] == null ? "—" : `${pct(r[`${k}_abs`])} (${signShort(r[`${k}_signed`])})`) });
  table(s, sum, [
    { label: "нагрузка", key: "load" }, { label: "область", value: (r) => REGION[r.region], text: true }, { label: "точек", key: "points" },
    ...["rps", "itps_new", "otps", "ttft_p50", "ttft_p90", "tpot"].map(cell),
  ]);

  // 2. Final charts per workload.
  s = section("Итоговые графики: прогноз против замера",
    "Линия — прогноз модели по N (выбранный вариант decode сплошной, остальные — тонкие, включаются в легенде), точки — замер (среднее по повторам). " +
    "Все графики ориентированы так, что «лучше» — в одну сторону: вверх и вправо. Вертикальные пунктиры на графиках от N — колено KV по модели и по замеру.");
  const ctl = el("div", { class: "tiles" });
  s.append(ctl);
  const body = el("div", { style: "display:grid;gap:14px" });
  s.append(body);
  const drawSys = () => {
    ctl.replaceChildren();
    const loads = [...new Set(W.map((w) => w.load))];
    const pickRow = el("div", { style: "display:grid;gap:8px" });
    ctl.append(pickRow);
    for (const load of loads) sysButtons(pickRow, W.filter((w) => w.load === load).map((w) => [w.key, w.label]), sysState.key, (k) => { sysState.key = k; drawSys(); }, `нагрузка ${load}`);
    sysButtons(pickRow, Object.entries(TOKEN_KIND).map(([k, v]) => [k, `токены: ${v.label}`]), sysState.kind, (k) => { sysState.kind = k; drawSys(); }, "токены");
    body.replaceChildren();
    const keep = charts.filter((c) => !body.contains(c.box) && document.body.contains(c.box));
    charts = keep;
    renderWorkload(body, W.find((w) => w.key === sysState.key), sysState.kind);
    if (window.Plotly) for (const c of charts.filter((c) => body.contains(c.box))) { const [t, l] = c.build(); Plotly.react(c.box, t, l, { displaylogo: false, responsive: true }); }
    if (window.MathJax?.typesetPromise) MathJax.typesetPromise([body]);
  };
  drawSys();

  // 3. Economics.
  renderEconomics();

  // 4. Model: pipeline, coefficients, variants.
  s = section("Модель: от шага к системе",
    "Шаг → система. Модель шага (prefill — модель A ядра, decode — вариант ниже) даёт время шага по его составу; модель «от N» строит состав по пулу и N и складывает шаги в метрики системы.");
  const forms = el("div", { class: "formulas" });
  const block = (title, text, latex) => forms.append(el("div", { class: "formula-block" }, el("h3", {}, title), text ? el("p", {}, text) : null, ...latex.map((eq) => el("div", { class: "math" }, `\\[${eq}\\]`))));
  block("1. Работающие запросы", "Набор из B запросов пула с весом по времени жизни (O), у каждого случайный момент жизни \\(k = 0 \\ldots O-1\\); свои блоки целые по 256, общие блоки семьи — самый длинный префикс среди её работающих. Новый запрос принимается, только если свободны блоки на весь его prompt, кроме префикса, который уже держат работающие (can_allocate); в момент отказа свободна в среднем половина нужного ему.",
    ["\\bar U_{\\mathrm{KV}}(B) + \\tfrac12 \\bar n_{\\text{новый}}(B) = \\text{блоков KV} \\;\\Rightarrow\\; B_{\\mathrm{KV}}, \\qquad B(N) = \\min(N,\\ B_{\\mathrm{KV}},\\ \\text{max\\_num\\_seqs})"]);
  block("2. Время GPU на запрос и RPS", "Первый токен даёт prefill, остальные \\(O - 1\\) — decode-шаги, каждый обслуживает B запросов; накладные шага prefill \\(c\\) делятся на \\(k = \\max(1, B/\\bar O)\\) новых запросов на шаг.",
    ["\\tau = \\bar T_{\\mathrm{pf}} + (\\bar O - 1)\\, \\frac{T_{\\mathrm{dc}}(B, \\textstyle\\sum\\ell, U)}{B}, \\qquad \\mathrm{RPS} = 1/\\tau",
     "\\mathrm{ITPS}_{\\text{новые}} = \\mathrm{RPS}\\,\\overline{L(1-R)}, \\quad \\mathrm{ITPS}_{\\text{полный}} = \\mathrm{RPS}\\,\\bar L, \\quad \\mathrm{OTPS} = \\mathrm{RPS}\\,\\bar O"]);
  block("3. TPOT, TTPS и TTFT", "TPOT — по закону Литтла для работающих: B = RPS × время decode запроса; в TPOT входят и prefill новых запросов. TTFT — свой prefill-шаг (с k запросами) плюс очередь; новый запрос подаётся между шагами, поэтому текущий шаг он не ждёт.",
    ["\\mathrm{TPOT} = \\frac{B}{\\mathrm{RPS}\\,(\\bar O - 1)}, \\quad \\mathrm{TTPS} = 1/\\mathrm{TPOT}, \\quad \\mathrm{TTFT}_i = T_{\\mathrm{pf}}^{\\text{шаг}}(i) + \\frac{\\max(0, N - B)}{\\mathrm{RPS}}"]);
  block("4. Когорты и fixed_batch", "Если у всех запросов пула одинаковые L и O (W1), до колена они идут когортами: когорта из N проходит prefill-шаги по бюджету токенов, затем \\(O - 1\\) шагов при B = N. fixed_batch — волны до 8 запросов подряд по пулу; волна идёт до самого длинного O (B убывает), новый запрос ждёт конца волны; волны считаются подряд с предсказанными шагами.", []);
  block("5. Прямая бюджета для точки N", "Цены одного запроса этой нагрузки при этом N; точка модели — пересечение прямой с лучом смеси.",
    ["\\tilde a = \\frac{\\bar T_{\\mathrm{pf}}}{\\overline{L(1-R)}}, \\quad \\tilde b = \\frac{\\tau - \\bar T_{\\mathrm{pf}}}{\\bar O}, \\quad \\tilde a\\,\\mathrm{ITPS} + \\tilde b\\,\\mathrm{OTPS} = 1, \\quad \\frac{\\mathrm{OTPS}}{\\mathrm{ITPS}} = \\frac{\\bar O}{\\overline{L(1-R)}}"]);
  block("6. Варианты decode", "U — токены KV шага без повторов общего префикса; κ = 1 — повтор стоит как обычный токен, κ = 0 — бесплатен.", Object.values(V).map((v) => v.latex));
  s.append(forms);
  s.append(el("p", {}, `Prefill (модель A ядра, train S1 + S2): ${coefText({ a: S.core.a, b: S.core.b, c: S.core.c })}. Ядро до изменений (decode «а» на S1 + S2): ${coefText({ d0: S.core.d0, d1: S.core.d1, d2: S.core.d2 })}.`));
  table(s, Object.entries(V).map(([k, v]) => ({ k, ...v })), [
    { label: "вариант", value: (r) => r.label + (r.k === ch ? " — выбран" : ""), text: true },
    ...["d0", "d1", "d2", "F", "kappa"].map((c) => ({ label: c === "kappa" ? "κ" : c, value: (r) => num(r.coef[c], 4) })),
  ]);
  s.append(el("h3", {}, "Выбор варианта: ошибка decode-шага"));
  s.append(el("p", { class: "lede" }, "Только train (S2, S6, S7 — подбор) и test шага S3. S5 и S8 в выборе не участвуют. Средняя |e| и средний знак по шагам."));
  const steps = S.step_errors, series = [...new Set(steps.map((r) => r.series))];
  table(s, series.map((sr) => ({ series: sr, part: steps.find((r) => r.series === sr).part, ...Object.fromEntries(steps.filter((r) => r.series === sr).map((r) => [r.variant, r])) })), [
    { label: "серия", key: "series" }, { label: "часть", key: "part" },
    ...Object.keys(V).map((v) => ({ label: V[v].label, value: (r) => (r[v] ? `${pct(r[v].mean_abs)} (${signShort(r[v].mean_signed)})` : "—") })),
  ]);
  s.append(el("h3", {}, "Варианты decode на уровне системы (для сравнения, не для выбора)"));
  table(s, S.summary.filter((r) => r.load === "все"), [
    { label: "вариант", value: (r) => V[r.variant].label, text: true }, { label: "область", value: (r) => REGION[r.region], text: true }, { label: "точек", key: "points" },
    ...["rps", "otps", "ttft_p50", "ttft_p90", "tpot"].map(cell),
  ]);
  const K = S.kappa;
  s.append(el("h3", {}, `Цена общего префикса: κ = ${num(K.value, 3)}`));
  s.append(el("p", { class: "lede" }, `κ подобран вместе с порогом шага F по S7: только попытки с \\(T \\ge ${K.floor_margin} F\\) и долей повторённых токенов \\((\\sum\\ell - U)/\\sum\\ell \\ge ${pct(K.min_shared, 0)}\\) — ${K.points} из ${K.attempts_shared} попыток с повторами. ` +
    "κ точки — из её T при подобранных d и F; ниже — медиана и квартили по точкам. При 2 запросах на семью κ ≈ 0, с 4 и больше — около 0,4–0,6, разброс по точкам широкий: κ = const — гипотеза."));
  const factorName = { B: "B", ell: "ℓ", R_target: "R (цель)", families: "семей", per_family: "запросов на семью (B / семей)" };
  table(s, K.table, [
    { label: "фактор", value: (r) => factorName[r.factor] ?? r.factor, text: true }, { label: "значение", key: "value" }, { label: "точек", key: "points" },
    { label: "κ, медиана", key: "median", fmt: (v) => num(v, 3) }, { label: "Q1", key: "q1", fmt: (v) => num(v, 3) }, { label: "Q3", key: "q3", fmt: (v) => num(v, 3) },
  ]);
  s.append(el("h3", {}, "Колено, потолок и очередь"));
  const row = chartRow(s);
  table(row, kn, [
    { label: "вариант", key: "label", text: true }, { label: "B_KV модель", key: "pred", fmt: (v) => num(v, 3) },
    { label: "колено замер", key: "fact", fmt: (v) => num(v, 3) }, { label: "e", key: "e", fmt: signShort },
  ]);
  table(row, S.special.ceiling, [
    { label: "вариант", key: "label", text: true }, { label: "N max", key: "N" }, { label: "RPS замер", key: "meas", fmt: (v) => num(v, 3) },
    ...Object.keys(V).map((v) => ({ label: `e ${V[v].label}`, key: `e_${v}`, fmt: signShort })),
  ]);
  const Q = S.special.queue;
  if (Q.length) {
    s.append(el("p", { class: "lede" }, "Очередь в TTFT выше колена: замер — среднее время от подачи до первого планирования запроса, модель — (N − B)/RPS."));
    table(s, Q, [
      { label: "вариант", key: "label", text: true }, { label: "N", key: "N" }, { label: "очередь замер, с", key: "meas", fmt: (v) => num(v, 3) },
      { label: "модель, с", key: `pred_${ch}`, fmt: (v) => num(v, 3) }, { label: "e", key: `e_${ch}`, fmt: signShort },
    ], true);
  }

  // 5. Data.
  renderSystemData();

  // 6. Limits.
  s = section("Ограничения модели «от N»");
  s.append(el("ul", { class: "notes" }, ...S.limits.map((n) => el("li", {}, n))));
}

function renderWorkload(parent, w, kind) {
  const S = D.local.system, V = S.variants, ch = S.choice, K = TOKEN_KIND[kind];
  const pts = w.points, curve = w.curve;
  parent.append(el("p", {}, el("strong", {}, w.label), ` — ${w.load_label}. Пул ${w.pool.requests} запросов × ${w.pool.seeds} сида: \\(\\bar L = ${int(w.pool.L_mean)}\\), \\(\\bar O = ${int(w.pool.O_mean)}\\), \\(R = ${num(w.pool.R, 3)}\\)` +
    (w.pool.uniform ? "; все L и O одинаковые — до колена запросы идут когортами" : "") + ". " +
    (w.scheduler === "fixed_batch" ? `Волна ${num(w.knee_pred, 2)} запросов.` : `Колено KV: модель ${num(w.knee_pred, 3)}, замер ${w.knee_fact == null ? "— (KV не заполнялся)" : num(w.knee_fact, 3)}.`)));
  const kneeShapes = () => [[w.knee_pred, "модель"], [w.knee_fact, "замер"]].filter(([x]) => x != null).map(([x], i) => ({ type: "line", xref: "x", yref: "paper", x0: x, x1: x, y0: 0, y1: 1, line: { color: css("--muted"), width: 1, dash: i ? "dot" : "dash" } }));
  const lines = (key, name, opts = {}) => Object.keys(V).map((v) => ({
    type: "scatter", mode: "lines", name: `${name} · модель ${V[v].label}`, x: curve[v].map((r) => opts.x ? opts.x(r) : r.N), y: curve[v].map((r) => (typeof key === "function" ? key(r) : r[key])),
    line: { color: opts.color ?? sysVariantColor(v), width: v === ch ? 2.5 : 1, dash: v === ch ? "solid" : "dot" }, visible: v === ch ? true : "legendonly",
    hovertemplate: `${name}, ${V[v].label}<br>N %{customdata}<br>%{x:.4g} → %{y:.4g}<extra></extra>`, customdata: curve[v].map((r) => r.N),
  }));
  const meas = (key, name, opts = {}) => ({
    type: "scatter", mode: "markers", name: `${name} · замер`, x: pts.map((p) => opts.x ? opts.x(p) : p.N), y: pts.map((p) => (typeof key === "function" ? key(p) : p[key])),
    marker: { color: opts.color ?? css("--fg"), size: 9, symbol: pts.map((p) => (p.region === "above" ? "circle-open" : "circle")), line: { width: 1.5, color: opts.color ?? css("--fg") } },
    text: pts.map((p) => `N ${p.N} (фаза ${p.phase}, ${p.seeds} повт., ${REGION[p.region]})<br>RPS ${num(p.rps, 3)}, прогноз ${num(p.pred[ch].rps, 3)} (${signShort(p.e[ch].rps)})<br>TTFT p50 ${num(p.ttft_p50, 3)} с, прогноз ${num(p.pred[ch].ttft_p50, 3)}<br>TPOT ${num(p.tpot * 1e3, 3)} мс, прогноз ${num(p.pred[ch].tpot * 1e3, 3)}<br>завершений в окне от ${p.completed_min}`),
    hovertemplate: "%{text}<extra></extra>",
  });
  const cap = (text) => parent.append(el("p", { class: "lede" }, text));
  const nAxis = (extra = {}) => ({ xaxis: { ...baseLayout().xaxis, type: "log", title: { text: "N, запросов в системе (лог)" } }, shapes: kneeShapes(), ...extra });

  parent.append(el("h3", {}, "Метрики от N"));
  cap(`На осях — N (лог) и метрика. Сплошная — прогноз, точки — замер (полые — выше колена). ${w.caption.metrics}`);
  let row = chartRow(parent);
  chart(row, () => [[...lines("rps", "RPS"), meas("rps", "RPS")], baseLayout("RPS от N", "N", "RPS, запросов/с", nAxis())], true);
  chart(row, () => [[...lines("otps", "OTPS", { color: css("--m1") }), meas("otps", "OTPS", { color: css("--m1") }), ...lines(K.rate, K.short, { color: css("--m3") }), meas(K.rate, K.short, { color: css("--m3") })],
    baseLayout(`OTPS и ${K.short} от N`, "N", "токенов/с", nAxis())], true);
  row = chartRow(parent);
  chart(row, () => [[...lines("ttft_p50", "TTFT p50", { color: css("--m1") }), meas("ttft_p50", "TTFT p50", { color: css("--m1") }), ...lines("ttft_p90", "TTFT p90", { color: css("--m4") }), meas("ttft_p90", "TTFT p90", { color: css("--m4") })],
    baseLayout("TTFT от N (ниже — лучше)", "N", "TTFT, с (лог)", nAxis({ yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "TTFT, с (лог)" } } }))], true);
  chart(row, () => [[...lines((r) => r.tpot * 1e3, "TPOT"), meas((p) => p.tpot * 1e3, "TPOT")], baseLayout("TPOT от N (ниже — лучше)", "N", "TPOT, мс", nAxis())], true);

  parent.append(el("h3", {}, `ITPS–OTPS: прямые бюджета по N (${K.label})`));
  cap(`По оси x — ${K.label}/с, по y — OTPS. Для каждого измеренного N — прямая модели \\(\\tilde a\\,x + \\tilde b\\,\\mathrm{OTPS} = 1\\) с коэффициентами общей модели при этом N; крест — точка модели на луче смеси, круг — замер. ${w.caption.line}`);
  row = chartRow(parent);
  chart(row, () => {
    const traces = [];
    const Ns = [...new Set(pts.map((p) => p.N))];
    let xmax = 0, ymax = 0;
    Ns.forEach((n, i) => {
      const p = pts.find((q) => q.N === n), r = p.pred[ch], color = seqColor(i, Ns.length);
      const aKind = kind === "new" ? r.a_tilde : r.a_tilde_full;
      const ends = kind === "all" ? [[1 / aKind, 0], [1 / r.b_tilde, 1 / r.b_tilde]] : [[1 / aKind, 0], [0, 1 / r.b_tilde]];
      traces.push({ type: "scatter", mode: "lines", name: `N ${n}`, legendgroup: String(n), x: ends.map((e) => e[0]), y: ends.map((e) => e[1]), line: { color, width: 1 }, hoverinfo: "skip" });
      traces.push({ type: "scatter", mode: "markers", legendgroup: String(n), showlegend: false, x: [K.rate(r)], y: [r.otps], marker: { color, symbol: "x-thin-open", size: 14, line: { width: 2.5, color } },
        hovertemplate: `N ${n} · модель<br>x ${num(K.rate(r), 4)}, OTPS ${num(r.otps, 4)}<extra></extra>` });
      traces.push({ type: "scatter", mode: "markers", legendgroup: String(n), showlegend: false, x: [K.rate(p)], y: [p.otps], marker: { color, size: 9, line: { width: 1, color: css("--bg") } },
        hovertemplate: `N ${n} · замер<br>x ${num(K.rate(p), 4)}, OTPS ${num(p.otps, 4)}<extra></extra>` });
      xmax = Math.max(xmax, K.rate(p), K.rate(r)); ymax = Math.max(ymax, p.otps, r.otps);
    });
    return [traces, baseLayout("ITPS–OTPS по N", `${K.label}, ток/с`, "OTPS, выходных ток/с", { xaxis: { ...baseLayout().xaxis, range: [0, xmax * 1.6], title: { text: `${K.label}, ток/с` } }, yaxis: { ...baseLayout().yaxis, range: [0, ymax * 1.6], title: { text: "OTPS, выходных ток/с" } } })];
  }, true);

  parent.append(el("h3", {}, "Пропускная способность GPU от TTPS на пользователя"));
  cap(`По x — TTPS = 1/TPOT, токенов/с одному пользователю; по y — токены/с всей GPU: OTPS и «${K.short}» (для «все токены» — вход + выход). Точки по N — граница компромисса: правее — быстрее пользователю, выше — больше GPU. ${w.caption.throughput}`);
  row = chartRow(parent);
  const total = kind === "all" ? K.rate : (r) => K.rate(r) + r.otps;
  chart(row, () => [[...lines("otps", "OTPS", { x: (r) => r.ttps, color: css("--m1") }), meas("otps", "OTPS", { x: (p) => 1 / p.tpot, color: css("--m1") }),
    ...lines(total, `все токены (${K.short}${kind === "all" ? "" : " + выход"})`, { x: (r) => r.ttps, color: css("--m3") }), meas(total, "все токены", { x: (p) => 1 / p.tpot, color: css("--m3") })],
    baseLayout("Токены/с GPU от TTPS", "TTPS, ток/с на пользователя", "токенов/с всей GPU")], true);

  parent.append(el("h3", {}, "TTPS–TTFT"));
  cap(`По x — TTFT p50 (лог, ось развёрнута: правее — меньше ждать), по y — TTPS. ${w.caption.ttft}`);
  row = chartRow(parent);
  chart(row, () => [[...lines("ttps", "TTPS", { x: (r) => r.ttft_p50 }), meas((p) => 1 / p.tpot, "TTPS", { x: (p) => p.ttft_p50 })],
    baseLayout("TTPS от TTFT p50", "TTFT p50, с", "TTPS, ток/с", { xaxis: { ...baseLayout().xaxis, type: "log", autorange: "reversed", title: { text: "TTFT p50, с (лог, развёрнута)" } } })], true);
  table(parent, pts, [
    { label: "N", key: "N" }, { label: "фаза", key: "phase" }, { label: "повт.", key: "seeds" }, { label: "область", value: (p) => REGION[p.region], text: true },
    { label: "RPS", value: (p) => `${num(p.rps, 3)} / ${num(p.pred[ch].rps, 3)}` }, { label: "e RPS", value: (p) => signShort(p.e[ch].rps) },
    { label: "OTPS", value: (p) => `${int(p.otps)} / ${int(p.pred[ch].otps)}` }, { label: "e OTPS", value: (p) => signShort(p.e[ch].otps) },
    { label: "TTFT p50, с", value: (p) => `${num(p.ttft_p50, 3)} / ${num(p.pred[ch].ttft_p50, 3)}` }, { label: "e", value: (p) => signShort(p.e[ch].ttft_p50) },
    { label: "TTFT p90, с", value: (p) => `${num(p.ttft_p90, 3)} / ${num(p.pred[ch].ttft_p90, 3)}` }, { label: "e", value: (p) => signShort(p.e[ch].ttft_p90) },
    { label: "TPOT, мс", value: (p) => `${num(p.tpot * 1e3, 3)} / ${num(p.pred[ch].tpot * 1e3, 3)}` }, { label: "e", value: (p) => signShort(p.e[ch].tpot) },
  ], true);
  parent.append(el("p", { class: "lede" }, "В таблице: замер / прогноз."));
}

// Economics of one GPU, step by step (the system block of the local model).
const ECON_NAME = { S5: "S5", W1: "W1", W2: "W2", W3: "W3", W4: "W4" };
const LOAD_DESC = {
  S5: "смесь: промпт 513–4096 токенов, ответ 16–256, у четырёх групп общий префикс 2–8 блоков по 256",
  W1: "все запросы одинаковые: промпт 2048, ответ 128, общий префикс 1024",
  W2: "короткий промпт 256–1024, длинный ответ 256–1024, общий префикс — половина промпта",
  W3: "длинный промпт 4096–12288, короткий ответ 16–64, общий префикс — половина промпта",
  W4: "длины как в S5, общий префикс — 80% промпта",
};
const ECON_ORDER = ["S5", "W1", "W2", "W3", "W4"];
const ECON_COLOR = { S5: "--c1", W4: "--c2", W1: "--c3", W2: "--c4", W3: "--c5" };
const econRu = (v, d = 0) => (v == null ? "—" : v.toLocaleString("ru-RU", { maximumFractionDigits: d, minimumFractionDigits: d }));

function econSteps(parent) {
  const E = D.local.system.economics;
  parent.append(el("h3", {}, "Расчёт выручки по шагам"));
  const forms = el("div", { class: "formulas" });
  const step = (title, latex, legend) => forms.append(el("div", { class: "formula-block" }, el("h3", {}, title), el("div", { class: "math" }, `\\[${latex}\\]`), el("p", { class: "lede" }, legend)));
  step("1. Цены токенов", "p = p^{\\mathrm{8B}} \\cdot \\frac{0.6}{8}", "p — цена 0.6B за 1 млн токенов (отдельно p_in для входа, p_c для входа из кэша, p_out для выхода); p⁸ᴮ — открытая цена Qwen3-8B, у 0.6B своей нет.");
  step("2. Чек одного запроса", "v = \\frac{p_{\\mathrm{in}} \\cdot L(1 - R) + p_{\\mathrm{c}} \\cdot L R + p_{\\mathrm{out}} \\cdot O}{10^6}", "v — сколько стоит один запрос, $; L, R, O — как в шаге 1 и 2: длина промпта, доля из кэша, длина ответа.");
  step("3. Запросов в час", "Q = \\frac{3600 \\cdot u}{\\tau}", "τ — время GPU на запрос из шага 2 при наибольшем N, у которого выполняется требование к качеству; u — доля часа, когда есть нагрузка.");
  step("4. Выручка в час", "\\mathrm{Rev} = v \\cdot Q", "Rev — $ в час.");
  step("5. Прибыль в час", "\\Pi_{\\text{аренда}} = \\mathrm{Rev} - C_{\\mathrm{rent}}, \\qquad \\Pi_{\\text{своя}} = \\mathrm{Rev} - W \\cdot t_{\\mathrm{el}}", "C_rent — аренда такой карты в час; W — мощность карты, кВт; t_el — тариф, $ за кВт·ч.");
  step("6. Окупаемость своей карты", "T_{\\mathrm{pay}} = \\frac{P_{\\mathrm{gpu}}}{24 \\cdot (u \\cdot \\mathrm{Rev}_{u=1} - W \\cdot t_{\\mathrm{el}})}", "T_pay — дней круглосуточной работы до окупаемости; P_gpu — цена карты; Rev_{u=1} — выручка при полной загрузке.");
  parent.append(forms);
  const g = E.gpu, b = E.base;
  parent.append(el("h3", {}, "Параметры и источники"));
  table(parent, [
    ["p_{\\mathrm{in}}^{\\mathrm{8B}},\\ p_{\\mathrm{c}}^{\\mathrm{8B}},\\ p_{\\mathrm{out}}^{\\mathrm{8B}}", "цены Qwen3-8B за 1 млн токенов", `$${b.input}, $${b.cached_input}, $${b.output}; ${b.source}, ${b.date}`],
    ["p_{\\mathrm{in}},\\ p_{\\mathrm{c}},\\ p_{\\mathrm{out}}", "цены 0.6B за 1 млн токенов", `$${econRu(E.prices.input, 5)}, $${econRu(E.prices.cached_input, 5)}, $${econRu(E.prices.output, 4)}`],
    ["u", "доля времени под нагрузкой", `${econRu(E.utilization * 100)}%`],
    ["C_{\\mathrm{rent}}", "аренда GPU, $ в час", `$${g.rent_per_hour}; ${g.rent_source}`],
    ["W", "мощность GPU под нагрузкой, кВт", `${g.power_kw}; ${g.power_source}`],
    ["t_{\\mathrm{el}}", "тариф, $ за кВт·ч", `$${g.tariff_per_kwh}; ${g.tariff_source}`],
    ["P_{\\mathrm{gpu}}", "цена своей карты, $", `$${g.price}; ${g.price_source}`],
    ["T_{\\mathrm{life}}", "срок службы карты", `${g.lifetime_years} года`],
  ].map(([tex, what, value]) => ({ tex, what, value })), [
    { label: "обозначение", value: (r) => `\\(${r.tex}\\)`, text: true },
    { label: "что это", key: "what", text: true },
    { label: "значение и источник (config.yaml)", key: "value", text: true },
  ]);
}

function econRows(sloLabel) {
  const E = D.local.system.economics;
  return ECON_ORDER.flatMap((l) => ["on", "off"].map((c) => E.rows.find((r) => r.load === l && r.cache === c && r.slo === sloLabel))).filter(Boolean);
}
const econName = (r) => `${ECON_NAME[r.load]}, ${r.cache === "on" ? "с кэшем" : "без кэша"}`;

function econCharts(parent, sloIdx) {
  const E = D.local.system.economics, slo = E.slo[sloIdx], g = E.gpu;
  const life = 365 * g.lifetime_years, Cel = E.electricity_per_hour, rows = econRows(slo.label).filter((r) => r.N != null);
  const style = (r) => ({ color: css(ECON_COLOR[r.load]), width: r.cache === "on" ? 2.5 : 1.5, dash: r.cache === "on" ? "solid" : "dash" });
  const lifeText = `срок службы ${g.lifetime_years} года`;

  parent.append(el("h3", {}, `Накопленная прибыль своей карты (требование «${slo.label}»)`));
  let row = chartRow(parent);
  chart(row, () => {
    const t = [], ann = [];
    const days = [0, life * 1.1];
    let ymin = -g.price, ymax = 0;
    for (const r of rows) {
      const slope = 24 * r.profit_own;
      const ys = days.map((d) => -g.price + slope * d);
      ymin = Math.min(ymin, ...ys); ymax = Math.max(ymax, ...ys);
      const label = `${econName(r)} — ${r.payback_days == null ? "не окупается" : `окупится за ${econRu(r.payback_days)} дн.`}`;
      t.push({ type: "scatter", mode: "lines", name: label, legendgroup: econName(r), x: days, y: ys, line: style(r), hovertemplate: `${econName(r)}<br>день %{x:.0f}: $%{y:,.0f}<extra></extra>` });
      if (r.payback_days != null && r.payback_days <= life * 1.1) t.push({ type: "scatter", mode: "markers", legendgroup: econName(r), showlegend: false, x: [r.payback_days], y: [0],
        marker: { color: style(r).color, size: 9, line: { width: 1.5, color: css("--bg") } }, hovertemplate: `${econName(r)}: окупится за %{x:.0f} дн.<extra></extra>` });
    }
    ann.push({ x: life, y: 1, yref: "paper", text: lifeText, showarrow: false, xanchor: "right", yanchor: "top", font: { size: 11, color: css("--muted") } });
    return [t, baseLayout("", "дней работы (24 часа в сутки)", "накопленная прибыль, $", {
      margin: { l: 72, r: 20, t: 16, b: 56 }, annotations: ann,
      shapes: [{ type: "line", xref: "x", yref: "paper", x0: life, x1: life, y0: 0, y1: 1, line: { color: css("--muted"), width: 1, dash: "dot" } },
               { type: "line", xref: "paper", yref: "y", x0: 0, x1: 1, y0: 0, y1: 0, line: { color: css("--fg"), width: 1 } }],
      yaxis: { ...baseLayout().yaxis, range: [ymin * 1.05, Math.max(ymax * 1.05, g.price * 0.2)], title: { text: "накопленная прибыль, $" } },
    })];
  }, true);
  const paid = rows.filter((r) => r.payback_days != null).sort((a, b) => a.payback_days - b.payback_days);
  const inLife = paid.filter((r) => r.payback_days <= life);
  parent.append(el("div", { class: "read" },
    el("p", {}, el("strong", {}, "Как читать. "), `По x — дни круглосуточной работы, по y — накопленная прибыль своей карты: в день 0 она равна минус цене карты ($${g.price}), дальше растёт на 24·(Rev − C_el) в день. Где линия пересекает ноль (точка на линии) — карта окупилась; срок указан в легенде. Пунктирная вертикаль — ${lifeText}. Сплошные линии — с кэшем префиксов, штриховые — без.`),
    el("p", {}, el("strong", {}, "Вывод. "), paid.length
      ? `Быстрее всех окупается «${econName(paid[0])}» — за ${econRu(paid[0].payback_days)} дн. ${inLife.length === paid.length ? "Все нагрузки окупаются в пределах срока службы." : `В пределах срока службы окупаются ${inLife.length} из ${rows.length}; ${rows.length - inLife.length ? `остальные — нет.` : ""}`}`
      : "Ни одна нагрузка не окупает карту: выручка не покрывает электроэнергию.")));

  parent.append(el("h3", {}, "Срок окупаемости от загрузки GPU"));
  row = chartRow(parent);
  chart(row, () => {
    const t = [], us = Array.from({ length: 91 }, (_, i) => 0.1 + i * 0.01);
    for (const r of rows) {
      const rev1 = r.rev / E.utilization;
      t.push({ type: "scatter", mode: "lines", name: econName(r), x: us.map((u) => u * 100), y: us.map((u) => (u * rev1 > Cel ? g.price / (24 * (u * rev1 - Cel)) : null)), line: style(r),
        hovertemplate: `${econName(r)}<br>загрузка %{x:.0f}%: %{y:,.0f} дн.<extra></extra>` });
    }
    t.push({ type: "scatter", mode: "lines", name: lifeText, x: [10, 100], y: [life, life], line: { color: css("--muted"), width: 1, dash: "dot" }, hoverinfo: "skip" });
    return [t, baseLayout("", "загрузка u, % времени под нагрузкой", "срок окупаемости, дней (лог. шкала)", {
      margin: { l: 72, r: 20, t: 16, b: 56 }, xaxis: { ...baseLayout().xaxis, range: [10, 100], title: { text: "загрузка u, % времени под нагрузкой" } },
      yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "срок окупаемости, дней (лог. шкала)" } },
    })];
  }, true);
  const breakEven = (r) => { const rev1 = r.rev / E.utilization; const u = (g.price / (24 * life) + Cel) / rev1; return u; };
  const best = rows.map((r) => ({ r, u: breakEven(r) })).sort((a, b) => a.u - b.u)[0];
  const never = rows.filter((r) => r.rev / E.utilization <= Cel);
  parent.append(el("div", { class: "read" },
    el("p", {}, el("strong", {}, "Как читать. "), `По x — доля времени, когда на GPU есть запросы; по y — через сколько дней своя карта окупится при такой загрузке. Ниже пунктира (${lifeText}) — окупается за срок службы. Линия обрывается там, где выручка ниже расхода на электроэнергию: карта не окупается вовсе.`),
    el("p", {}, el("strong", {}, "Вывод. "), best
      ? `Окупаемость растёт быстрее, чем падает загрузка: при половинной загрузке срок больше чем вдвое. За срок службы «${econName(best.r)}» окупается начиная с загрузки ${best.u <= 1 ? `${econRu(best.u * 100)}%` : "выше 100% — то есть никогда"}.${never.length ? ` Не окупаются даже при 100%: ${never.map(econName).join(", ")}.` : ""}`
      : "")));
}

function econTable(parent, sloLabels) {
  const rows = sloLabels.flatMap((l) => econRows(l));
  table(parent, rows, [
    { label: "нагрузка", value: econName, text: true }, { label: "SLO", key: "slo" },
    { label: "N", value: (r) => (r.N == null ? "SLO не выполняется" : String(r.N)) },
    { label: "τ, мс", value: (r) => (r.tau == null ? "—" : econRu(r.tau * 1e3, 1)) },
    { label: "Q, запросов/ч", value: (r) => econRu(r.Q) },
    { label: "Rev, $/ч", value: (r) => econRu(r.rev, 3) },
    { label: "прибыль при аренде, $/ч", value: (r) => econRu(r.profit_rent, 3) },
    { label: "прибыль своей картой, $/ч", value: (r) => econRu(r.profit_own, 3) },
    { label: "T_pay, дней", value: (r) => (r.N == null ? "—" : r.payback_days == null ? "не окупается" : econRu(r.payback_days)) },
  ], rows.length > 12);
}

  s.append(forms);
  s.append(el("p", {}, `Коэффициенты: ${coefText(coef)}`));

  // 3. Final charts.
  const L = D.prices.lines.ref;

  s = section(D.local ? "Окна и бюджет по трассе (тождество)" : "Итоговые графики", D.local

  if (!D.local) {

      "В окне \\(I_w\\) — новые (не кэшированные) входные токены его prefill-шагов, \\(O_w\\) — токены его decode-шагов, \\(T_w\\) — длина окна; " +

    row = chartRow(s);
    chart(row, () => {

        { xaxis: { ...baseLayout().xaxis, range: [0, hi], title: { text: "x = ã_w · ITPS_w (prefill)" } }, yaxis: { ...baseLayout().yaxis, range: [0, hi], scaleanchor: "x", title: { text: "y = b̃_w · OTPS_w (decode)" } } })];
    }, true);
    const mid = W.summary.filter((r) => r.part !== "train");
    if (mid.length) s.append(el("p", {}, mid.map((r) => `${sourceLabel(r.source)} (${PART_LABEL[r.part] ?? r.part}): ${int(r.windows)} окон, в середине (prefill 30–70%) ${int(r.share_30_70)}; средняя \\(|x + y - 1|\\) ${pct(r.mean_abs_gap)}` + (r.mean_abs_gap_mid != null ? `, в середине ${pct(r.mean_abs_gap_mid)}` : "") + ".").join(" ")));
    table(s, W.summary, [
      { label: "данные", value: (r) => sourceLabel(r.source), text: true }, { label: "часть", value: (r) => PART_LABEL[r.part] ?? r.part },
      { label: "окон", key: "windows", fmt: int }, { label: "prefill 0–30%", key: "share_0_30", fmt: int },
      { label: "30–70%", key: "share_30_70", fmt: int }, { label: "70–100%", key: "share_70_100", fmt: int },
      { label: "средняя |x + y − 1|", key: "mean_abs_gap", fmt: (v) => pct(v) }, { label: "она же в 30–70%", key: "mean_abs_gap_mid", fmt: (v) => pct(v) },
    ]);
  }
  s.append(el("p", { class: "lede" }, "Бюджет по модели \\(\\tilde a \\cdot \\mathrm{ITPS} + \\tilde b \\cdot \\mathrm{OTPS} = \\hat T_{\\mathrm{total}} / T^{\\mathrm{wall}} = 1 + e\\); по замеру — \\(\\sum T_s / T^{\\mathrm{wall}}\\), доля времени, когда GPU считает шаги. По трассе это тождество: ã и b̃ взяты из тех же шагов, поэтому прямая — проверка времени шагов, а не прогноз системы."));
  table(s, D.prices.runs.filter((r) => r.part !== "unused"), [
    { label: "прогон", key: "run_id", text: true, mono: true }, { label: "данные", value: (r) => sourceLabel(r.source), text: true },
    { label: "часть", value: (r) => PART_LABEL[r.part] ?? r.part }, { label: "кэш", key: "cache" }, { label: "планировщик", key: "scheduler", text: true },
    { label: "I новые", key: "I_new", fmt: int }, { label: "ITPS (новые)", key: "ITPS", fmt: int }, { label: "OTPS", key: "OTPS", fmt: (v) => num(v, 3) },
    { label: "ã модель, с/ток", key: "a_model", fmt: (v) => num(v, 3) }, { label: "b̃ модель, с/ток", key: "b_model", fmt: (v) => num(v, 3) },
    { label: "бюджет: модель", key: "budget_model", fmt: (v) => num(v, 4) }, { label: "бюджет: замер", key: "budget_meas", fmt: (v) => num(v, 4) },
  ], true);
  s.append(el("h3", {}, "TTPS–TTFT"));
  if (!D.arrivals) s.append(el("p", {}, el("strong", {}, "Во всех прогонах одна нагрузка (запросы приходят разом), поэтому это разброс внутри очереди, а не кривая от нагрузки. Для гиперболы нужны прогоны с разным числом одновременных пользователей.")));
  s.append(el("p", { class: "lede" }, "Замер: \\(\\mathrm{TTFT}\\) = первый токен − постановка в очередь, \\(\\mathrm{TPOT} = (\\text{конец} - \\text{первый токен}) / (O - 1)\\), \\(\\mathrm{TTPS} = 1/\\mathrm{TPOT}\\). " +
    "Модель: TTFT — сумма предсказанных шагов от прихода запроса до шага его первого токена, TPOT — предсказанные шаги после первого токена до последнего, делённые на \\(O - 1\\). " +
    "Здесь ожидание взято из трассы, а не предсказано (очередь предсказывает модель «от N» — разделы в начале отчёта). Одна точка — медианы TTFT и TTPS по группе запросов." +
    (D.local?.closed_loop ? " Главная кривая — закрытый цикл S5: в системе ровно N запросов, линии по возрастанию N для каждой пары (планировщик, кэш), подпись — N; модель — та же линия пунктиром с полыми точками. Поток S4 (открытый, за изломом там очередь) — в разделе S4. Остальные группы (train, S3, S0 — все запросы приходят разом) — на отдельном графике." : "")));
  const CL = D.local?.closed_loop;
  const groups = (D.request_groups || []).filter((g) => g.ttps != null);
  const rest = groups.filter((g) => g.rho == null && g.source !== CL?.source);
  if (CL) {

  }
  row = chartRow(s);
  if (rest.length) chart(row, () => {
    const traces = [];
    for (const g of rest) {
      const color = cacheColor(g.cache), symbol = schedSymbol(g.scheduler);

      traces.push({ type: "scatter", mode: "markers", name, x: [g.ttft], y: [g.ttps], text: [text], hovertemplate: "%{text}<extra></extra>", showlegend: false,

    }
    for (const c of [...new Set(rest.map((g) => g.cache))]) traces.push({ type: "scatter", mode: "markers", name: `кэш ${c}`, x: [null], y: [null], marker: { color: cacheColor(c), size: 10 } });
    for (const sc of [...new Set(rest.map((g) => g.scheduler))]) traces.push({ type: "scatter", mode: "markers", name: sc, x: [null], y: [null], marker: { color: css("--muted"), symbol: schedSymbol(sc), size: 10 } });
    traces.push({ type: "scatter", mode: "markers", name: "модель", x: [null], y: [null], marker: { color: css("--muted"), symbol: "circle-open", size: 10, line: { width: 1.5 } } });
    return [traces, baseLayout(D.local ? "Запросы приходят разом: train, S3, S0" : "TTPS–TTFT: медианы по группам", "TTFT, с (медиана, лог)", "TTPS = 1 / TPOT, ток/с (медиана)", { xaxis: { ...baseLayout().xaxis, type: "log", title: { text: "TTFT, с (медиана, лог)" } } })];
  }, true);

  chart(cloud, () => {
    const reqs = D.requests.filter((r) => r.part !== "unused" && r.ttps != null);

  // 4. Metrics.
  s = section("Ошибки и коэффициенты",

  // 5. Prediction against measurement.

  chart(row, () => { const t = scatterByPart(dc, "T", "pred", dcHover); t.push(identityLine(dc.map((r) => r.T), dc.map((r) => r.pred))); return [t, baseLayout("Decode-шаг", "замер, s", "предсказание, s")]; });

  chart(row, () => [binnedTraces(onTrain(D.prefill_binned.L_mean)), errLayout("Prefill: ошибка от L̄", "средняя L шага, токены", "ошибка (медиана)")]);

  const g = D.prefill_grid || {};

  });
  row = chartRow(s);

  chart(row, () => [binnedTraces(onTrain(D.decode_binned.B)), errLayout("Decode: ошибка от B", "B, запросов в шаге", "ошибка (медиана)")]);

  // 7. Breakdown by scheduler and cache.
  s = section("Разбивка по планировщику и кэшу", "Test-прогоны: \\(|e|\\) и средний знак \\(T_{\\mathrm{total}}\\).");
  table(s, D.test_breakdown, [
    { label: "планировщик", key: "scheduler", text: true }, { label: "кэш", key: "cache" },
    { label: "средняя", key: "mean", fmt: (v) => pct(v) }, { label: "медиана", key: "median", fmt: (v) => pct(v) },
    { label: "максимум", key: "max", fmt: (v) => pct(v) }, { label: "средний знак", key: "mean_signed", fmt: signed }, { label: "n", key: "count" },
  ]);
  const lost = D.runs.filter((r) => r.lost_tokens > 0);
  if (lost.length) {
    s.append(el("p", {}, "Прогоны, где сборщик потерял вытесненный запрос (шаги трассы верны, \\(O\\) — фактический):"));
    table(s, lost, [{ label: "прогон", key: "run_id", text: true, mono: true }, { label: "часть", value: (r) => PART_LABEL[r.part] ?? r.part }, { label: "планировщик", key: "scheduler", text: true },
      { label: "O", key: "O", fmt: int }, { label: "потеряно токенов", key: "lost_tokens", fmt: int }, { label: "e", key: "rel_err", fmt: (v) => pct(v) }]);
  }

  // 8. Prefill function form: forms with a per-run factor, R dependence, noise.
  const pfm = D.prefill_forms;
  if (pfm && pfm.run_factor) {
    const own = pfm.run_factor_used === false;
    s = section("Форма prefill: какая функция описывает время", own
      ? `Только prefill-шаги train-сеток: ${pfm.n_steps} шагов в ${pfm.n_runs} прогонах, ${pfm.n_groups} точек сетки. Машина одна и частота зафиксирована, а у прогона сетки обычно один prefill-шаг, ` +
        "поэтому формы подбираются без множителя прогона и проверяются leave-one-point-out: все повторы одной точки сетки уходят в test вместе."
      : `Только prefill-шаги: ${pfm.n_steps} шагов в ${pfm.n_runs} прогонах. Время шага \\(=\\) форма \\(\\times\\) множитель прогона (состояние общей машины), ` +
        "поэтому форма подбирается с отдельным множителем на каждый прогон и проверяется так: шаг предсказывается по форме, подобранной без него, и по множителю его прогона, оценённому на остальных шагах этого прогона.");
    const rf = pfm.run_factor, rq = pfm.request_R;
    const cost = pfm.cached_to_new_cost != null ? `Токен с готовым KV стоит \\(e/a = ${pfm.cached_to_new_cost.toFixed(2)}\\) от нового.` : "";
    s.append(el("p", {}, own
      ? `Лучшая форма: \\(${pfm.best_latex}\\) — ошибка на отложенной точке сетки ${pct(pfm.table[0].set_cv_mean)}. ${cost}`
      : `Лучшая форма: \\(${pfm.best_latex}\\) — ошибка внутри прогона ${pct(pfm.table[0].in_run_mean)}. ` +
        `Множитель прогона \\(\\in [${rf.p05.toFixed(2)},\\ ${rf.p95.toFixed(2)}]\\) (5–95%): без него у нового прогона ошибка около ${pct(pfm.table[0].set_cv_mean)}. ${cost}`));
    if (rq.hit_count) s.append(el("p", { class: "lede" }, `Строк с \\(C > 0\\): ${rq.hit_count}, \\(R \\in [${rq.hit_min?.toFixed(2)},\\ ${rq.hit_max?.toFixed(2)}]\\); строк с \\(R = 0\\): ${rq.zero_count}. ` +
      `У шагов с \\(C > 0\\) \\(R_{\\mathrm{step}} \\in [${rq.step_R_min_on?.toFixed(2)},\\ ${rq.step_R_max_on?.toFixed(2)}]\\).`));
    const formCoef = (c) => `\\(${Object.entries(c).map(([k, v]) => `${k === "alpha" ? "\\alpha" : texName(k)} = ${texNum(v)}`).join(",\\ ")}\\)`;
    table(s, pfm.table, [
      { label: "форма", key: "name", text: true },
      { label: "функция", value: (r) => `\\(${r.latex}\\)`, text: true },
      { label: "параметров", key: "params" },
      { label: "внутри прогона: средняя", key: "in_run_mean", fmt: (v) => pct(v) },
      { label: "медиана", key: "in_run_median", fmt: (v) => pct(v) },
      { label: "максимум", key: "in_run_max", fmt: (v) => pct(v) },
      { label: own ? "отложенная точка (leave-one-point-out)" : "новый прогон (leave-one-set-out)", key: "set_cv_mean", fmt: (v) => pct(v) },
      { label: "коэффициенты", value: (r) => formCoef(r.coef), text: true },
    ]);
    row = chartRow(s);
    const byCache = (x, y, hover) => ["off", "on"].map((c) => {
      const sub = pfm.points.filter((r) => r.cache === c);
      return { type: "scatter", mode: "markers", name: `кэш ${c}`, x: sub.map((r) => r[x]), y: sub.map((r) => r[y]),
        marker: { color: cacheColor(c), size: 8, opacity: 0.8, line: { width: 1, color: css("--bg") } }, text: sub.map(hover), hovertemplate: "%{text}<extra></extra>" };
    }).filter((t) => t.x.length);
    chart(row, () => {
      const traces = byCache("R_step", "per_token", (r) => `${r.run_id} ${r.step_id}<br>R ${r.R_step.toFixed(2)}, B ${r.B}<br>ΣL ${r.sumL}, ΣC ${r.sumC}<br>${r.per_token.toFixed(3)}`);
      traces.push({ type: "scatter", mode: "lines", name: `форма для запроса L = ${Math.round(pfm.r_curve.L_ref)}`, x: pfm.r_curve.x, y: pfm.r_curve.y, line: { color: css("--fg"), width: 2 }, hoverinfo: "skip" });
      return [traces, baseLayout("T / T(R = 0) от R", "R = ΣC / ΣL (кэш + нарезка)", "T / T(R = 0), без множителя прогона и d·B")];
    });
    chart(row, () => [byCache("N", "T_norm", (r) => `${r.run_id} ${r.step_id}<br>N ${r.N}, B ${r.B}, R ${r.R_step.toFixed(2)}<br>T ${r.T.toFixed(3)} s, без множителя ${r.T_norm.toFixed(3)} s`), baseLayout("T / множитель от N", "N — считаемые токены шага", "T / множитель прогона, s")]);
  }

  // 9. Transfer sources.
  transfers.forEach((src, i) => {
    s = section(`Перенос: ${src.label}`,
      `Коэффициенты — от ${train?.label}, без подгонки. ${src.runs} прогон(ов), ${src.prefill_steps} prefill- и ${src.decode_steps} decode-шагов.`);
    table(s, D.runs.filter((r) => r.source === src.id), [
      { label: "прогон", key: "run_id", text: true, mono: true },
      { label: "\\(T^{\\mathrm{wall}}\\), s", key: "wall_seconds", fmt: (v) => num(v, 4) }, { label: "\\(\\hat T_{\\mathrm{total}}\\), s", key: "pred", fmt: (v) => num(v, 4) },
      { label: "\\(e\\)", key: "rel_err", fmt: (v) => pct(v) }, { label: "\\(T_{\\mathrm{pf}}\\), s", key: "prefill_seconds", fmt: (v) => num(v, 3) },
      { label: "\\(\\hat T_{\\mathrm{pf}}\\), s", key: "prefill_hat", fmt: (v) => num(v, 3) }, { label: "\\(I\\)", key: "I", fmt: int }, { label: "\\(O\\)", key: "O", fmt: int },
    ]);
    row = chartRow(s);
    const tpf = D.prefill_steps.filter((r) => r.source === src.id);
    chart(row, () => { const t = scatterByPart(tpf, "T", "pred", pfHover); t.push(identityLine(tpf.map((r) => r.T), tpf.map((r) => r.pred))); return [t, baseLayout("Prefill-шаги", "замер, s", "предсказание, s")]; });
    const tdc = D.decode_sample.filter((r) => r.source === src.id);
    if (tdc.length) chart(row, () => { const t = scatterByPart(tdc, "T", "pred", dcHover); t.push(identityLine(tdc.map((r) => r.T), tdc.map((r) => r.pred))); return [t, baseLayout("Decode-шаги", "замер, s", "предсказание, s")]; });
  });

  // 10. Coverage.
  s = section("Покрытие данных", "Диапазоны признаков по каждому набору; гистограммы нормированы, чтобы сравнивать формы распределений.");
  table(s, D.coverage, [
    { label: "данные", value: (r) => sourceLabel(r.source), text: true }, { label: "признак", value: (r) => texVar(r.variable), text: true },
    { label: "min", key: "min", fmt: (v) => num(v, 4) }, { label: "p05", key: "p05", fmt: (v) => num(v, 4) },
    { label: "медиана", key: "median", fmt: (v) => num(v, 4) }, { label: "p95", key: "p95", fmt: (v) => num(v, 4) },
    { label: "max", key: "max", fmt: (v) => num(v, 4) }, { label: "n", key: "n" },
  ]);
  row = chartRow(s);
  [...new Set(D.coverage.map((r) => r.variable))].forEach((v) => chart(row, () => [(D.sources || []).map((src) => ({
    type: "histogram", name: src.label, x: (D.coverage_values[src.id] || {})[v] || [], histnorm: "probability", bingroup: 1,
    opacity: 0.6, marker: { color: src.role === "train" ? partColor("train") : partColor("transfer"), line: { width: 1, color: css("--bg") } },
    hovertemplate: `${v} %{x}<br>доля %{y:.1%}<extra>${src.label}</extra>`,
  })), baseLayout(subLabel(v), subLabel(v), "доля", { barmode: "overlay", yaxis: { ...baseLayout().yaxis, tickformat: ".0%", title: { text: "доля" } } })]));

  // 11. Notes.
  s = section("Ограничения и оговорки");
  s.append(el("ul", { class: "notes" }, ...(D.notes || []).map((n) => el("li", {}, n))));
}

// "Коротко": the capacity of one GPU from the model "from N" (the system block of the local model).

let briefState = { cache: "on", slo: 1 };
const ru = (v, d = 0) => (v == null ? "—" : v.toLocaleString("ru-RU", { maximumFractionDigits: d, minimumFractionDigits: d }));
const pct0 = (v) => (v == null ? "—" : `${Math.round(v * 100)}%`);

function briefSystem() {
  return DOC.models.find((m) => m.local?.system)?.local.system;
}
function briefSeg(parent, items, current, pick, label) {
  const sw = el("div", { class: "switch", role: "group", "aria-label": label });
  for (const [v, text] of items) {
    const b = el("button", { type: "button", "aria-pressed": String(v === current) }, text);
    b.addEventListener("click", () => { if (v !== current) { pick(v); renderReport("brief"); draw(); } });
    sw.append(b);
  }
  parent.append(sw);
}
function briefRead(parent, how, what) {
  parent.append(el("div", { class: "read" }, el("p", {}, el("strong", {}, "Как читать. "), how), el("p", {}, el("strong", {}, "Вывод. "), what)));
}

function renderBrief() {
  charts = [];

  const cv = w.curve[ch], pts = [...w.points].sort((a, b) => a.N - b.N);
  const name = `${w.load}, ${w.cache === "on" ? "с кэшем префиксов" : "без кэша"}`;
  const lay = (x, y, extra = {}) => baseLayout("", x, y, { margin: { l: 72, r: 24, t: 16, b: 56 }, ...extra });

  // 1. Step model.

    "Движок работает шагами. Prefill-шаг считает промпты новых запросов, decode-шаг выдаёт по одному токену ответа всем запросам в работе. Модель предсказывает длительность шага; она подобрана на замерах S1 (prefill) и S2 (decode).");
  let f = el("div", { class: "formulas" });
  formula(f, "T_{\\mathrm{pf}} = a \\cdot L(1 - R) + b \\cdot L^2 (1 - R^2) + c", "Prefill одного запроса. L — длина промпта, токенов; R — доля промпта, взятая из кэша; a, b, c — коэффициенты.");

  s.append(f);

  s.append(f);

  row = chartRow(s);
  chart(row, () => {
    const c1 = css("--c1"), c2 = css("--c2"), tot = (r) => r.itps_full + r.otps;
    return [[
      { type: "scatter", mode: "lines", name: "OTPS — модель", x: cv.map((r) => r.ttps), y: cv.map((r) => r.otps), line: { color: c1, width: 2.5 }, customdata: cv.map((r) => r.N), hovertemplate: "N %{customdata}: TTPS %{x:.0f}, OTPS %{y:,.0f}<extra></extra>" },
      { type: "scatter", mode: "markers", name: "OTPS — замер", x: pts.map((p) => 1 / p.tpot), y: pts.map((p) => p.otps), marker: { color: c1, size: 9, line: { width: 1, color: css("--bg") } }, customdata: pts.map((p) => p.N), hovertemplate: "N %{customdata} · замер: TTPS %{x:.0f}, OTPS %{y:,.0f}<extra></extra>" },
      nLabels(pts, (p) => 1 / p.tpot, (p) => p.otps, c1),
      { type: "scatter", mode: "lines", name: "вход + выход — модель", x: cv.map((r) => r.ttps), y: cv.map(tot), line: { color: c2, width: 2.5 }, customdata: cv.map((r) => r.N), hovertemplate: "N %{customdata}: TTPS %{x:.0f}, всего %{y:,.0f}<extra></extra>" },
      { type: "scatter", mode: "markers", name: "вход + выход — замер", x: pts.map((p) => 1 / p.tpot), y: pts.map(tot), marker: { color: c2, size: 9, line: { width: 1, color: css("--bg") } }, customdata: pts.map((p) => p.N), hovertemplate: "N %{customdata} · замер: TTPS %{x:.0f}, всего %{y:,.0f}<extra></extra>" },
    ], lay("TTPS, токенов в секунду одному пользователю", "токенов в секунду всей GPU (лог. шкала)", { yaxis: { ...baseLayout().yaxis, type: "log", title: { text: "токенов в секунду всей GPU (лог. шкала)" } } })];
  }, true);
  briefRead(s, "Каждая точка — одно N (подписано). Правее — быстрее одному пользователю, выше — больше токенов всей GPU.",
    `При N = 1 пользователь получает ${int(cv[0].ttps)} ток/с, GPU выдаёт ${int(cv[0].otps)} выходных ток/с. При N = ${kneeN.N}: ${int(kneeN.ttps)} ток/с пользователю и ${int(kneeN.otps)} выходных ток/с всей GPU.`);

  s.append(el("h3", {}, "TTPS и TTFT"));
  row = chartRow(s);
  chart(row, () => {
    const c = css("--c1");
    return [[
      { type: "scatter", mode: "lines+markers", name: "замер", x: pts.map((p) => p.ttft_p50), y: pts.map((p) => 1 / p.tpot), line: { color: c, width: 2 }, marker: { color: c, size: 9, line: { width: 1, color: css("--bg") } }, customdata: pts.map((p) => p.N), hovertemplate: "N %{customdata} · замер: TTFT %{x:.2f} с, TTPS %{y:.0f}<extra></extra>" },
      nLabels(pts, (p) => p.ttft_p50, (p) => 1 / p.tpot, c),
      { type: "scatter", mode: "lines", name: "модель", x: cv.map((r) => r.ttft_p50), y: cv.map((r) => r.ttps), line: { color: css("--muted"), width: 1.5, dash: "dot" }, customdata: cv.map((r) => r.N), hovertemplate: "N %{customdata} · модель: TTFT %{x:.2f} с, TTPS %{y:.0f}<extra></extra>" },
    ], lay("TTFT, с (медиана; ось развёрнута: правее — меньше ждать)", "TTPS, токенов в секунду одному пользователю", { xaxis: { ...baseLayout().xaxis, type: "log", autorange: "reversed", title: { text: "TTFT, с (медиана; ось развёрнута: правее — меньше ждать)" } } })];
  }, true);
  const lastP = pts[pts.length - 1], kneeP = pts.filter((p) => p.N <= w.knee_pred).slice(-1)[0];
  briefRead(s, "Лучше — вверх и вправо. Точки подписаны N; с ростом N пользователь получает меньше токенов в секунду и дольше ждёт первый.",
    `До предела памяти (N ≤ ${kneeP.N}) TTFT не больше ${num(kneeP.ttft_p50, 2)} с, падает только TTPS. После предела растёт очередь: при N = ${lastP.N} TTFT ${num(lastP.ttft_p50, 2)} с.`);
  table(s, Object.entries({ rps: "RPS", otps: "OTPS", ttft_p50: "TTFT, медиана", ttft_p90: "TTFT, 90%", tpot: "TPOT" }).map(([k, n]) => ({ n, below: acc.below[`${k}_abs`], above: acc.above[`${k}_abs`] })), [
    { label: "ошибка прогноза (все нагрузки)", key: "n", text: true },
    { label: `до предела памяти (${acc.below.points} точек)`, key: "below", fmt: (v) => `±${pct0(v)}` },
    { label: `после (${acc.above.points} точек)`, key: "above", fmt: (v) => `±${pct0(v)}` },
  ]);

  // 3. Business.
  s = section("Шаг 3. Переход к деньгам",
    "Технические метрики шага 2 переводим в выручку. Требование к качеству задаёт, сколько пользователей N можно держать: наибольшее N, при котором TTFT (90%) и TPOT не выше порогов.");
  briefSeg(s, E.slo.map((x, i) => [i, `${x.label}: TTFT ≤ ${x.ttft_p90} с, TTPS ≥ ${ru(1 / x.tpot)}`]), briefState.slo, (v) => { briefState.slo = v; }, "требование к качеству");
  econSteps(s);
  s.append(el("h3", {}, `Выручка в час от N: ${name}`));
  row = chartRow(s);
  const pr = E.prices;
  const money = (r) => 3600 * (pr.input * r.itps_new + pr.cached_input * (r.itps_full - r.itps_new) + pr.output * r.otps) / 1e6;
  const slo = E.slo[briefState.slo], meets = (r) => r.ttft_p90 <= slo.ttft_p90 && r.tpot <= slo.tpot;
  const okN = cv.filter(meets).slice(-1)[0];
  chart(row, () => {
    const c = css("--c1"), last = cv[cv.length - 1].N, t = [
      { type: "scatter", mode: "lines", name: "выручка — модель", x: cv.map((r) => r.N), y: cv.map(money), line: { color: c, width: 2.5 }, hovertemplate: "N %{x}: $%{y:.3f} в час<extra></extra>" },
      { type: "scatter", mode: "markers", name: "выручка — замер", x: pts.map((p) => p.N), y: pts.map(money), marker: { color: c, size: 9, line: { width: 1, color: css("--bg") } }, hovertemplate: "N %{x} · замер: $%{y:.3f} в час<extra></extra>" },
      { type: "scatter", mode: "lines", name: `аренда GPU, $${E.gpu.rent_per_hour}/ч`, x: [1, last], y: [E.gpu.rent_per_hour, E.gpu.rent_per_hour], line: { color: css("--muted"), width: 1.5, dash: "dash" }, hoverinfo: "skip" },
      { type: "scatter", mode: "lines", name: `электроэнергия своей карты, $${num(E.electricity_per_hour, 2)}/ч`, x: [1, last], y: [E.electricity_per_hour, E.electricity_per_hour], line: { color: css("--muted"), width: 1.5, dash: "dot" }, hoverinfo: "skip" },
    ];
    if (okN) t.push({ type: "scatter", mode: "markers+text", name: `наибольшее N при «${slo.label}»`, x: [okN.N], y: [money(okN)], text: [`N ${okN.N}`], textposition: "top center", marker: { color: css("--good"), size: 14, line: { width: 2, color: css("--bg") } }, hovertemplate: `N %{x}: $%{y:.3f} в час<extra></extra>` });
    return [t, lay("N — пользователей одновременно (лог. шкала)", "выручка, $ в час", { xaxis: { ...baseLayout().xaxis, type: "log", title: { text: "N — пользователей одновременно (лог. шкала)" } } })];
  }, true);
  briefRead(s, `Линия — выручка в час при данном N. Зелёная точка — наибольшее N, при котором выполняется «${slo.label}». Горизонтали — затраты в час: аренда карты и электроэнергия своей.`,
    okN ? `При «${slo.label}» ${w.load} даёт $${num(money(okN), 3)} в час при N = ${okN.N}: ${money(okN) > E.gpu.rent_per_hour ? "больше аренды" : "меньше аренды — арендовать карту убыточно"}${money(okN) > E.electricity_per_hour ? ", своя карта окупает электроэнергию" : ", своя карта не окупает даже электроэнергию"}.` : `Требование «${slo.label}» не выполняется ни при каком N.`);
  econCharts(s, briefState.slo);
  econTable(s, [slo.label]);
}

function renderReport(index) {
  const brief = index === "brief";
  if (brief) index = DOC.models.findIndex((m) => m.local?.system);
  D = DOC.models[index];
  app.replaceChildren();
  const meta = DOC.meta || {};
  const header = el("header", {}, el("h1", {}, "Модель времени nano-vLLM"),
    el("div", { class: "meta" }, ...[
      `создан ${meta.created_utc ?? "—"}`, `коммит ${(meta.git_commit || "").slice(0, 7)}`, `fit=${meta.fit}`,
      `seed=${meta.seed}`, `запуск ${meta.run_dir ?? "—"}`, `формат v${DOC.schema_version}`,
    ].map((t) => el("span", {}, t))));
  const sw = el("div", { class: "switch", role: "group", "aria-label": "Модель" });
  if (briefSystem()) {
    const b = el("button", { type: "button", "aria-pressed": String(brief) }, "Коротко: ёмкость GPU");
    b.addEventListener("click", () => {
      if (brief) return;
      try { history.replaceState(null, "", "#brief"); } catch (e) { /* the viewer may refuse */ }
      renderReport("brief"); draw();
    });
    sw.append(b);
  }
  DOC.models.forEach((m, i) => {
    const b = el("button", { type: "button", "aria-pressed": String(i === index && !brief) }, m.caveat ? `${m.label} · ${m.caveat}` : m.label);
    b.addEventListener("click", () => {
      if (i === index && !brief) return;
      try { history.replaceState(null, "", "#m" + (i + 1)); } catch (e) { /* the viewer may refuse */ }
      renderReport(i); draw();
    });
    sw.append(b);
  });
  header.append(sw);
  app.append(header);
  if (brief) { renderBrief(); return; }
  const summary = D.local?.system ? null : summaryTable();
  if (summary) app.append(summary);
  if (D.caveat) app.append(el("p", { class: "banner" }, el("strong", {}, `${D.label}: ${D.caveat}.`),
    " Сервер общий: состояние машины (частота, чужие задачи) меняется от прогона к прогону, поэтому ошибки здесь — сумма ошибки модели и шума машины. Чистые данные — у Qwen3-0.6B local."));
  if (D.kind === "vidur") renderVidur(); else renderModel();
}

function renderIndex() {
  app.append(el("header", {}, el("h1", {}, "Запуски модели времени nano-vLLM"),
    el("div", { class: "meta" }, el("span", {}, `${D.entries.length} запусков`))));
  const keys = [];
  const cell = (e, key) => { for (const m of e.models || []) for (const [k, v] of Object.entries(m.cells || {})) if (k === key) return v; return null; };
  for (const e of D.entries) for (const m of e.models || []) {
    m.cells = {};
    for (const [name, v] of Object.entries(m.test || {})) m.cells[`${m.label} · test |e| · ${name}`] = v;
    for (const [t, byName] of Object.entries(m.transfer || {})) for (const [name, v] of Object.entries(byName)) m.cells[`${m.label} → ${t} · e · ${name}`] = v;
    for (const k of Object.keys(m.cells)) if (!keys.includes(k)) keys.push(k);
  }
  const s = section("Все запуски", "Средняя |ошибка| T_total на test и ошибка со знаком на наборах переноса, по моделям и способам decode (старые запуски формата v1 — со своими способами). Ссылка открывает отчёт запуска.");
  table(s, D.entries, [
    { label: "запуск", value: (e) => el("a", { href: e.report }, e.run), text: true, mono: true },
    { label: "формат", value: (e) => `v${e.schema_version}` }, { label: "fit", key: "fit" }, { label: "decode", key: "decode" }, { label: "seed", key: "seed" },
    ...keys.map((k) => ({ label: k, value: (e) => pct(cell(e, k)) })),
    { label: "коммит", value: (e) => (e.git_commit || "").slice(0, 7), mono: true },
  ]);
  const testKeys = keys.filter((k) => k.includes(" · test "));
  const colors = ["--m1", "--m2", "--m3", "--m4"];
  const row = chartRow(s);
  chart(row, () => [testKeys.map((k, i) => ({
    type: "scatter", mode: "markers", name: k, x: D.entries.map((e) => e.run), y: D.entries.map((e) => cell(e, k)),
    marker: { color: css(colors[i % 4]), size: 10, line: { width: 1, color: css("--bg") } }, hovertemplate: "%{x}<br>%{y:.1%}<extra>" + k + "</extra>",
  })), errLayout("Средняя |ошибка| T_total на test по запускам", "запуск", "|ошибка|")]);
}

function drawCharts() {
  for (const { box, build } of charts) {
    const [traces, layout] = build();
    Plotly.react(box, traces, layout, { displaylogo: false, responsive: true, modeBarButtonsToRemove: ["lasso2d", "select2d"] });
  }
}
function draw() {
  if (window.Plotly) drawCharts();
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise([app]);
}
// #m2 opens the second model; any other hash opens the first.
const fromHash = Number((location.hash.match(/^#m(\d+)$/) || [])[1]) - 1;
if (DOC.kind === "index") { D = DOC; renderIndex(); } else if (location.hash === "#brief" && briefSystem()) renderReport("brief"); else renderReport(fromHash >= 0 && fromHash < DOC.models.length ? fromHash : 0);
if (window.Plotly) drawCharts(); else app.prepend(el("p", { class: "neg" }, "Не удалось загрузить Plotly: графики недоступны, таблицы ниже полные."));
// Redraw with the other theme's tokens when the viewer switches themes.
const redraw = () => window.Plotly && drawCharts();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
