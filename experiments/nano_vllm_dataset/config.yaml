# Paired cache sweep; model and TP are selected by the hardware profile.
defaults:
  - base
  - _self_
  - profile@_global_: source_tp4

hydra:
  searchpath:
    - pkg://taei.conf

experiment:
  name: nano_vllm_dataset
  description: Non-block-aligned paired prefix-cache sweep with varied hit fractions.

mode: plan # plan | preflight | download | overhead | run
dataset:
  workload_protocol: six_set_paired_prefix_sweep_v1
  model_path: ${oc.env:TAEI_QWEN3_0_6B_PATH,${oc.env:HOME}/.cache/taei/models/Qwen3-0.6B}
  output_root: ${hydra:runtime.output_dir}/runs
  order_seed: 20261023
  run_limit: 0 # 0 means all 8 treatments/repeats; set 1 for a single run
  attempt_timeout_s: 1800 # Per-attempt hard timeout; 30 minutes.
  calibration_report: null # retained for old CLI compatibility; no acceptance gate
  overhead_output_root: ${hydra:runtime.output_dir}/overhead
  overhead_workload: prefix_sweep
  overhead_seed: 42
  overhead_pair_count: 1
  telemetry_interval_s: 1.0
  requirements_document_id: b0d87b1f-2006-4d92-8fbf-2efc72375b3c
  requirements_revision: 16

download:
  enabled: true
  repo_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca

engine:
  backend: nano_vllm
  model: ${dataset.model_path}
  tensor_parallel_size: 4
  max_num_seqs: 8
  max_num_batched_tokens: 16384
  max_model_len: 4352 # Up to 4096 input tokens plus generation
  enforce_eager: false # CUDA graphs enabled
  gpu_memory_utilization: 0.9
  kvcache_block_size: 256

model:
  name: Qwen3-0.6B-local-snapshot
  path: ${dataset.model_path}
  family: null
  architecture: null
  huggingface_id: null
  revision: local_snapshot
  dtype: discovered_from_local_config
  upstream_config: null

logging:
  level: INFO
  markup: false
  clearml: false
clearml:
  enabled: false
