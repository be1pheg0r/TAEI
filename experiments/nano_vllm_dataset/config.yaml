# Exact pilot overrides: do not inherit the base 8B/TP2/4096-token engine values.
defaults:
  - base
  - _self_

hydra:
  searchpath:
    - pkg://taei.conf

experiment:
  name: nano_vllm_dataset
  description: Exact 24-run nano-vLLM dataset pilot; real inference only in mode=run.

mode: plan # plan | preflight | download | overhead | run
dataset:
  model_path: ${oc.env:TAEI_QWEN3_0_6B_PATH,${oc.env:HOME}/.cache/taei/models/Qwen3-0.6B}
  output_root: outputs/nano_vllm_dataset/runs
  order_seed: 20261023
  run_limit: 0 # 0 means all 24; set 1 for a manual smoke run
  calibration_report: null # path to a persisted separate overhead report
  overhead_output_root: outputs/nano_vllm_dataset/overhead
  overhead_workload: S
  overhead_seed: 42
  overhead_pair_count: 1
  telemetry_interval_s: 1.0
  requirements_document_id: b0d87b1f-2006-4d92-8fbf-2efc72375b3c
  requirements_revision: 16

download:
  enabled: true
  repo_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca

# This explicit section supersedes stale base engine defaults.
engine:
  backend: nano_vllm
  model: ${dataset.model_path}
  tensor_parallel_size: 1
  max_num_seqs: 8
  max_num_batched_tokens: 16384
  max_model_len: 4096
  enforce_eager: false # CUDA graphs enabled
  gpu_memory_utilization: 0.9
  kvcache_block_size: 256

# Labels are discovered from the selected local model config; no copied 8B metadata.
model:
  name: Qwen3-0.6B-local-snapshot
  path: ${dataset.model_path}
  family: null
  architecture: null
  huggingface_id: null
  revision: local_snapshot
  dtype: discovered_from_local_config
  upstream_config: null

logging:
  level: INFO
  markup: false
  clearml: false
clearml:
  enabled: false
