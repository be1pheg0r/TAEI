# 1, 2, 4, 8, 16 submitted requests; cache ON/OFF, dynamic scheduler only.
# Hit requests use 10%–95% target prefix reuse, rounded to 256-token blocks.
# Requests share a prefix; target order and generation are in request_scaling.py.
defaults:
  - base
  - _self_

hydra:
  searchpath:
    - pkg://taei.conf

experiment:
  name: nano_vllm_qwen3_8b_request_scaling
  description: Paired request-count and 10-95 percent prefix-cache scaling pilot.
mode: plan
dataset:
  workload_protocol: qwen3_8b_request_scaling_v1
  model_path: ${oc.env:TAEI_QWEN3_8B_PATH,${oc.env:HOME}/.cache/taei/models/Qwen3-8B}
  output_root: ${hydra:runtime.output_dir}/runs
  order_seed: 20261023
  run_limit: 0
  attempt_timeout_s: 3600
  calibration_report: null
  overhead_output_root: ${hydra:runtime.output_dir}/overhead
  overhead_workload: qwen3_8b_long_context_set_01
  overhead_seed: 42
  overhead_pair_count: 1
  telemetry_interval_s: 1.0
  requirements_document_id: null
  requirements_revision: null

download:
  enabled: true
  repo_id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
engine:
  backend: nano_vllm
  model: ${dataset.model_path}
  tensor_parallel_size: 2
  max_num_seqs: 8
  max_num_batched_tokens: 16384
  max_model_len: 32768
  enforce_eager: true
  gpu_memory_utilization: 0.9
  kvcache_block_size: 256
model:
  name: Qwen3-8B
  path: ${dataset.model_path}
  family: qwen3
  architecture: Qwen3ForCausalLM
  huggingface_id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  dtype: bfloat16
  upstream_config:
    architectures: [Qwen3ForCausalLM]
    model_type: qwen3
    torch_dtype: bfloat16
    hidden_size: 4096
    intermediate_size: 12288
    max_position_embeddings: 40960
    num_attention_heads: 32
    num_hidden_layers: 36
    num_key_value_heads: 8
    rope_scaling: null
hardware_profile:
  name: qwen3_8b_tp2_eager_request_scaling
  tensor_parallel_size: 2
  enforce_eager: true
logging:
  level: INFO
  markup: false
  clearml: false
clearml:
  enabled: false
