# One-run diagnostic with 13,000-token inputs and 1,000-token output budgets.
defaults:
  - base
  - _self_

hydra:
  searchpath:
    - pkg://taei.conf

experiment:
  name: nano_vllm_qwen3_8b_long_context_cache_on_diagnostic
  description: Single cache-on diagnostic run with paired shared-prefix hits and misses; not a performance study.

mode: plan
dataset:
  workload_protocol: qwen3_8b_cache_on_diagnostic_v1
  model_path: ${oc.env:TAEI_QWEN3_8B_PATH,${oc.env:HOME}/.cache/taei/models/Qwen3-8B}
  output_root: ${hydra:runtime.output_dir}/runs
  order_seed: 20261023
  run_limit: 1
  attempt_timeout_s: 3600
  calibration_report: null
  overhead_output_root: ${hydra:runtime.output_dir}/overhead
  overhead_workload: qwen3_8b_long_context_set_01
  overhead_seed: 42
  overhead_pair_count: 1
  telemetry_interval_s: 1.0
  requirements_document_id: b0d87b1f-2006-4d92-8fbf-2efc72375b3c
  requirements_revision: 16

download:
  enabled: true
  repo_id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218

engine:
  backend: nano_vllm
  model: ${dataset.model_path}
  tensor_parallel_size: 2
  max_num_seqs: 8
  max_num_batched_tokens: 16384
  max_model_len: 32768
  enforce_eager: true
  gpu_memory_utilization: 0.9
  kvcache_block_size: 256

model:
  name: Qwen3-8B
  path: ${dataset.model_path}
  family: qwen3
  architecture: Qwen3ForCausalLM
  huggingface_id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  dtype: bfloat16
  upstream_config:
    architectures: [Qwen3ForCausalLM]
    model_type: qwen3
    torch_dtype: bfloat16
    hidden_size: 4096
    intermediate_size: 12288
    max_position_embeddings: 40960
    num_attention_heads: 32
    num_hidden_layers: 36
    num_key_value_heads: 8
    rope_scaling: null

hardware_profile:
  name: qwen3_8b_tp2_eager_long_context_diagnostic
  tensor_parallel_size: 2
  enforce_eager: true

logging:
  level: INFO
  markup: false
  clearml: false
clearml:
  enabled: false
