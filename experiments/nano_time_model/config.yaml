# Подбор и проверка модели времени nano-vLLM по готовым прогонам из data/ (только CPU).
# Флаг: fit=optuna|regression.
# Пример: uv run python experiments/nano_time_model/run.py fit=regression
defaults:
  - base
  - _self_

hydra:
  searchpath:
    - pkg://taei.conf
  run:
    dir: runs/${now:%Y%m%d_%H%M%S}

experiment:
  name: nano_time_model
  description: Fit model A (prefill) and the decode step per model, check on transfer runs.

fit: optuna # optuna (mean relative error) | regression (NNLS on relative error)
seed: 42 # train/test split and optuna sampler
optuna:
  trials: 1500
extra_branches: [] # finished branch documents appended to the report, e.g. runs/<t>/vidur.json
windows: # ITPS–OTPS by time windows inside runs (section 03)
  seconds: 5.0
  min_steps: 5 # windows with fewer steps are dropped

economics: # steps of the GPU economics (report: «Экономика: шаги расчёта»)
  prices: # $ per 1M tokens of Qwen3-0.6B = prices of Qwen3-8B × 0.6 / 8
    base:
      model: Qwen3-8B
      input: 0.05
      cached_input: 0.05
      output: 0.20
      source: https://pricepertoken.com/pricing-page/model/qwen-qwen3-8b
      date: 2026-06-30
    scale: 0.075 # 0.6 / 8, by the number of parameters
  gpu:
    label: RTX 4070 (настольная, у ноутбучной нет отдельной цены)
    price: 599 # P_gpu, USD, launch MSRP
    price_source: https://www.gamespot.com/articles/nvidia-geforce-rtx-4070-will-retail-at-599-report/1100-6512871/
    rent_per_hour: 0.16 # C_rent, USD per hour of one RTX 4070
    rent_source: https://vast.ai/pricing/gpu/RTX-4070, 2026-10-29
    power_kw: 0.068 # median GPU power under load, own telemetry of phase D (S8)
    power_source: телеметрия nvidia-smi фазы D, медиана при загрузке GPU > 50%
    tariff_per_kwh: 0.182 # USD, US residential average, EIA STEO forecast for 2026
    tariff_source: https://www.eia.gov/outlooks/steo/report/elec_coal_renew.php
    lifetime_years: 3 # service life of the card
  utilization: 1.0 # u, share of time under load
  slo: # TTFT p90 and TPOT (median), seconds
    - {label: интерактив, ttft_p90: 0.5, tpot: 0.03}
    - {label: чат, ttft_p90: 1.0, tpot: 0.05}
    - {label: фон, ttft_p90: 3.0, tpot: 0.1}

models: # each model gets its own coefficients, split and transfer checks
  - label: Qwen3-0.6B local
    # Own RTX 4070 Laptop, TP=1, SM 2100 MHz (docs/nano-vllm-local.md).
    runs_dir: [data/qwen-3-06b-local/phase_A/runs, data/qwen-3-06b-local/phase_B/runs]
    run_ids: null
    series: [S1, S2, S3]
    split_by: {train: [S1, S2], test: [S3]} # grids train, prefill-share mixes test
    transfer:
      - label: Qwen3-0.6B local S4 (поток запросов)
        runs_dir: [data/qwen-3-06b-local/phase_B/runs]
        run_ids: null
        series: [S4]
      - label: Qwen3-0.6B local S0 (серверная нагрузка)
        runs_dir: [data/qwen-3-06b-local/phase_A/runs]
        run_ids: null
        series: [S0]
      - label: Qwen3-0.6B local S5 (перенос)
        # Closed loop: exactly N requests in the system (phase C).
        runs_dir: [data/qwen-3-06b-local/phase_C/runs]
        run_ids: null
        series: [S5]
    local:
      plans: [data/qwen-3-06b-local/phase_A/plan.json, data/qwen-3-06b-local/phase_B/plan.json, data/qwen-3-06b-local/phase_C/plan.json, data/qwen-3-06b-local/phase_D/plan.json]
      roots: [data/qwen-3-06b-local/phase_A/runs, data/qwen-3-06b-local/phase_B/runs, data/qwen-3-06b-local/phase_C/runs, data/qwen-3-06b-local/phase_D/runs]
      server_runs_dir: data/qwen-3-06b-768/20261025T092821.424493Z-6636be4c/runs
    system: # the model "from N": prediction of the closed loop from the pool and N only
      engine: {kv_blocks: 186, block_size: 256, max_num_seqs: 256, max_batched_tokens: 16384, wave: 8}
      # Decode variants: S2 + S6 fit d and the floor, S7 κ, S3 is the step test.
      # Phase D grids stay out of the core (S1 + S2), so its check is unchanged.
      step_roots: [data/qwen-3-06b-local/phase_A/runs, data/qwen-3-06b-local/phase_B/runs, data/qwen-3-06b-local/phase_D/runs]
      step_series: [S2, S3, S6, S7]
      check_roots: [data/qwen-3-06b-local/phase_C/runs, data/qwen-3-06b-local/phase_D/runs] # S5 and S8
      draws: 2000 # random running sets per B
      seed: 0
      warmup: 20 # closed-loop protocol of the fixed_batch wave sum
      measure: 200
      curve_max_n: 128
  - label: Qwen3-8B long context
    runs_dir: data/qwen-3-8b-768-big/home/scheglovmi/TAEI/outputs/background-runs/20261027T090746.833536Z-9370a1c5/runs
    run_ids: null
    split_by: [workload, condition_id] # workload: L or prefill-only P set
    transfer:
      - label: Qwen3-8B R15
        runs_dir: data/qwen3-8b-340/20261025T155137.987440Z-a0ffb7eb/runs
        run_ids: [R15] # the only completed 8B run of that launch
        caveat: машина была загружена, не проверка модели # GPUs shared, 34 KV blocks
  - label: Qwen3-0.6B
    caveat: шумная машина # shared server: per-run machine state varies
    runs_dir: data/qwen-3-06b-768/20261025T092821.424493Z-6636be4c/runs
    run_ids: null # all successful runs
    split_by: [set_id, cache]
    transfer: []
