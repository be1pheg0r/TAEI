# Подбор и проверка модели времени nano-vLLM по готовым прогонам из data/ (только CPU).
# Флаг: fit=optuna|regression.
# Пример: uv run python experiments/nano_time_model/run.py fit=regression
defaults:
  - base
  - _self_

hydra:
  searchpath:
    - pkg://taei.conf
  run:
    dir: runs/${now:%Y%m%d_%H%M%S}

experiment:
  name: nano_time_model
  description: Fit model A (prefill) and the decode step per model, check on transfer runs.

fit: optuna # optuna (mean relative error) | regression (NNLS on relative error)
seed: 42 # train/test split and optuna sampler
optuna:
  trials: 1500

models: # each model gets its own coefficients, split and transfer checks
  - label: Qwen3-0.6B
    runs_dir: data/qwen-3-06b-768/20261025T092821.424493Z-6636be4c/runs
    run_ids: null # all successful runs
    split_by: [set_id, cache]
    transfer: []
  - label: Qwen3-8B long context
    runs_dir: data/qwen-3-8b-768-big/home/scheglovmi/TAEI/outputs/background-runs/20261027T090746.833536Z-9370a1c5/runs
    run_ids: null
    split_by: [workload, condition_id] # workload: L or prefill-only P set
    transfer:
      - label: Qwen3-8B R15
        runs_dir: data/qwen3-8b-340/20261025T155137.987440Z-a0ffb7eb/runs
        run_ids: [R15] # the only completed 8B run of that launch
